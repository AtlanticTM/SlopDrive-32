# SlopSync Protocol Registry — SINGLE SOURCE OF TRUTH
# SPEC.md Appendices A and B are generated from (and MUST match) this file.
# Allocation policy: additions by PR to this file; numbers are never reused or
# renumbered once released in a tagged spec version. See SPEC.md §5.7.
#
# spec: slopsync/1
# status: v1.0-candidate
#
# NEVER-RENUMBER SCOPE: the no-reuse/no-renumber rule binds from the v1.0 tag
# FORWARD. v1-draft was the feasibility test, never a public release, so the
# public-v1.0 base pass (RFC queue 001–029 + the 2026-07-25 feasibility
# amendments) is permitted to restructure. After the v1.0 tag, additions only.

meta:
  protocol_name: slopsync
  protocol_version: 1
  byte_order: little-endian
  header_bytes: 8

# ---------------------------------------------------------------------------
# Frame types (u8). Header field `type`.
# dir: c2h = client→hub, h2c = hub→client, any = either direction.
# plane: control = CBOR payload (§5.3), data = packed payload (§5.4),
#        raw = fixed layout defined in its own spec section.
# ---------------------------------------------------------------------------
frame_types:
  0x00: { name: HELLO,          dir: c2h, plane: control, ref: "§6.2" }
  0x01: { name: WELCOME,        dir: h2c, plane: control, ref: "§6.3" }
  0x03: { name: PING,           dir: any, plane: raw,     ref: "§6.5" }
  0x04: { name: PONG,           dir: any, plane: raw,     ref: "§6.5" }
  0x05: { name: CLOCK,          dir: any, plane: raw,     ref: "§7.1" }
  0x06: { name: SUBSCRIBE,      dir: c2h, plane: control, ref: "§6.6" }
  0x07: { name: UNSUBSCRIBE,    dir: c2h, plane: control, ref: "§6.6" }
  0x08: { name: GRANT,          dir: h2c, plane: control, ref: "§10.2" }  # solicited AND unsolicited (GRANT_UPDATE)
  # ---- RETIRED PRE-v1.0 — DO NOT REALLOCATE 0x09 / 0x0A ----
  # 0x09 CATALOG_REQ and 0x0A CATALOG_CHUNK are superseded by BLOB_REQ (0x1A)
  # and BLOB_CHUNK (0x1B): RFC-021 generalized chunked transfer into a
  # namespaced blob verb, and catalog transfer is now simply blob namespace 0
  # (see `blob_namespaces`). The numbers stay burned so a stale v1-draft peer
  # meets an UNKNOWN type and fails loudly, never a silent misread.
  0x0B: { name: STATE,          dir: h2c, plane: data,    ref: "§9.1" }
  0x0C: { name: STREAM,         dir: any, plane: data,    ref: "§9.2" }
  0x0D: { name: INTENT,         dir: c2h, plane: control, ref: "§9.3" }
  0x0E: { name: ECHO,           dir: h2c, plane: control, ref: "§9.3" }
  0x0F: { name: EVENT,          dir: h2c, plane: control, ref: "§9.4" }
  0x10: { name: NACK,           dir: h2c, plane: control, ref: "§16.1" }
  0x11: { name: GOODBYE,        dir: any, plane: control, ref: "§6.8" }
  0x12: { name: PROBE,          dir: any, plane: raw,     ref: "§6.4" }
  0x13: { name: PROBE_REPORT,   dir: c2h, plane: control, ref: "§6.4" }
  0x14: { name: PAIR_REQ,       dir: c2h, plane: control, ref: "§12.2" }
  0x15: { name: PAIR_GRANT,     dir: h2c, plane: control, ref: "§12.2" }
  0x16: { name: ACKMASK,        dir: any, plane: raw,     ref: "§13.3" }  # ESP-NOW binding: base_seq:u16 + mask:u32
  0x17: { name: BEACON,         dir: h2c, plane: raw,     ref: "§13.7" }  # ESP-NOW discovery: hub id + etag + pairing flag
  0x18: { name: PUBLISH,        dir: c2h, plane: control, ref: "§6.6" }   # RFC-013: mid-session publish renegotiation — carries `publishes` (11); answered like SUBSCRIBE (GRANT / granted_publishes)
  0x19: { name: CATALOG_READY,  dir: c2h, plane: raw,     ref: "§8.4" }   # RFC-015: payload = the 8-byte etag the client now operates against. Idempotent; re-sent at catalog_chunk_gap_timeout_ms until retained STATE arrives.
  0x1A: { name: BLOB_REQ,       dir: c2h, plane: control, ref: "§8.4" }   # RFC-021: generalizes CATALOG_REQ — carries `blob` (38) to select namespace/store/slot, plus `chunks` (27) for repair
  0x1B: { name: BLOB_CHUNK,     dir: h2c, plane: raw,     ref: "§8.4" }   # RFC-021: generalizes CATALOG_CHUNK — raw header names the same identity fields as `blob_keys`, then chunk bytes
  0x1C: { name: AUTH,           dir: c2h, plane: control, ref: "§12.2" }  # RFC-029: post-WELCOME token proof (`trust`.token_proof); hub re-issues `roles` (23) on success, NACK UNAUTHORIZED on failure. Exists because a 2nd HELLO would self-evict via §6.3's duplicate-instance rule.
  0x1D: { name: HUB_SIG,        dir: h2c, plane: control, ref: "§12.2" }  # RFC-029 item 1, DEFERRED DELIVERY of the WELCOME signature. Payload is the `trust` (39) sub-map carrying `welcome_sig` (5) — nothing else, so the decode surface is one already-fuzzed sub-map. EXISTS BECAUSE SIGNING IS SLOW WHERE IT MATTERS: the S3 has no ECC accelerator, so mbedtls software ECDSA is ~30-80 ms in ONE uninterruptible call, and a hub that signed inline in WELCOME would stall its own tick (5 ms period) for 6-16 ticks — stalling STATE pacing, deadman detection and any motion-input drain sharing that task, for EVERY connecting client. A hub that CAN sign cheaply (host, sim, a C3/C6/H2 with the ECC peripheral) MAY instead put `welcome_sig` directly in WELCOME; the two are wire-alternatives with identical signature material and identical client handling, and a hub that never signs at all sends neither and stays conformant.
  0x1E: { name: DISCOVER_PROBE, dir: c2h, plane: raw,     ref: "§13.8" }   # RFC-046 §5: UDP discovery probe, broadcast on `udp_discovery.port` by a client with no BLE (or wanting WS-side discovery). No session; unicast REPLY answers it. Raw payload: magic(4B, `udp_discovery.magic`) + proto_ver:u8 + nonce:u32 (client entropy, echoed in the reply).
  0x1F: { name: DISCOVER_REPLY, dir: h2c, plane: raw,     ref: "§13.8" }   # RFC-046 §5, corrected by RFC-048 (operator veto, 2026-07-27): UDP discovery reply, hub-unicast back to the probe's source. Raw payload: magic(4B) + nonce:u32 (echoed) + hub_name:str32 (packed_field_types 9, RFC-026) + hub_instance_id:u64 (the hub's DURABLE cross-boot identity, identity_keys 5 — replaces this field's original RFC-046 payload, which reused the per-boot `boot_id`, §6.1; a boot-scoped id cannot deduplicate "two hubs sharing a name" across a reboot, which was this field's whole job) + proto_ver:u8 + ws_port:u16 + fw_version:str16 (packed_field_types 8) + catalog_etag:8B + flags:u8 (bit0 pairing_window_open — same philosophy as the 0x17 BEACON payload, plus the endpoint). Total payload grows 72B -> 76B (+4, u32->u64). Read-only identity, no control surface. Replies are rate-limited (`udp_discovery.reply_rate_limit_per_source_s`) so a probe storm cannot load the hub. RFC-046's own entry flagged this exact field for operator veto at landing; RFC-048 is that veto.
  0x20: { name: BLOB_DONE,      dir: any, plane: raw,     ref: "§8.4" }   # RFC-050: positive transfer-completion signal, generalizing CATALOG_READY's pattern (§6.4) to every blob namespace rather than a second frame per namespace. Raw payload: the same identity fields as `blob_keys` (namespace, store_id, slot, generation) + status:u8 (0 verified-complete, 1 hash-mismatch, 2 aborted). **Sent by the RECEIVER of a transfer** — for a hub-to-client blob (the common case) that is the client; for a client-to-hub STORE import it is the hub. Idempotent, like CATALOG_READY: safe to re-send on a duplicate or a retried reassembly. The sender treats a nonzero `status` per its own retry policy (this frame reports outcome, it does not itself request a retry). Implementation: Phase D (post-batch hub work) — see RFC-050.
  0xE5: { name: ESTOP,          dir: any, plane: raw,     ref: "§5.5, §11.2" }
# 0x02 and 0x21–0x3F reserved for spec/core (31 slots free; 0x09/0x0A burned, see above; 0x1E/0x1F allocated to RFC-046 UDP discovery; 0x20 allocated to RFC-050 BLOB_DONE).
# 0x40–0x7F reserved for future spec use.
# 0x80–0xDF experimental (never in tagged releases). 0xE0–0xFF reserved except 0xE5.

# ---------------------------------------------------------------------------
# Header flags (u8). Bits not listed MUST be zero on send, ignored on receive.
# ---------------------------------------------------------------------------
header_flags:
  bit0: { name: FRAG_START, ref: "§5.6" }
  bit1: { name: FRAG_MORE,  ref: "§5.6" }   # START+MORE=first, MORE=middle, START alone=only, neither+prior frags=last

# ---------------------------------------------------------------------------
# Channel classes (u8) — used in catalog entries.
# ---------------------------------------------------------------------------
channel_classes:
  0: { name: STATE,  ref: "§9.1" }
  1: { name: STREAM, ref: "§9.2" }
  2: { name: INTENT, ref: "§9.3" }
  3: { name: EVENT,  ref: "§9.4" }
  4: { name: STORE,  ref: "§8.7" }   # RFC-021: a blob store (presets, saved positions, trust ledger). Declared as an ORDINARY catalog entry so the catalog root shape, id sort, etag computation and per-entry depth rules are all untouched; the entry carries a store descriptor instead of a layout/schema. Items move over BLOB_REQ/BLOB_CHUNK.

# ---------------------------------------------------------------------------
# Stream kinds (u8) — catalog entry `stream_kind` (channel-entry key 15),
# STREAM class only (§9.2, §10.4).
#
# RFC-014/023 (feasibility-pass correction, 2026-07-25): this REPLACES the M5
# unit-string HEURISTIC ("a STREAM channel is segment-class iff any layout
# field declares a time unit") with an explicit, registered property. The
# heuristic was struck because `unit` is a free-form tstr — two conforming
# hubs could disagree ("ms" vs "msec" vs "millis") and therefore SHED
# DIFFERENTLY under identical congestion, exactly the divergence RFC-023
# exists to eliminate on a protocol heading for a third-party-implemented
# v1.0. SlopSync describes what things ARE, never how they should behave:
# this property says what a STREAM sample IS; §10.4's shedding table derives
# the never-decimate policy from it and is otherwise UNCHANGED.
#
# Absent on the wire MEANS `samples` (0) — §5.3 never emits an absent
# optional key, so every catalog entry predating this key (including the
# frozen mini-catalog fixture) is unaffected.
# ---------------------------------------------------------------------------
stream_kinds:
  0: { name: samples,  note: "dense points reporting a value AT AN INSTANT (§9.2); a dropped sample is recoverable by interpolation from its neighbors. Decimable under congestion. The default — absent on the wire means this." }
  1: { name: segments, note: "each sample COMMANDS A TIME EXTENT — it carries its own duration, so it is not a point on a continuous curve. A dropped segment is a permanently lost COMMAND, not a recoverable interpolation gap (RFC-014/023). NOT decimable: §10.4's shedding table sheds whole-source or not at all for these." }

# ---------------------------------------------------------------------------
# Access levels (u8) — catalog `access`, session roles.
# RFC-027 renamed the three tiers; WIRE VALUES ARE UNCHANGED.
#   old name (v1-draft docs)  ->  v1.0 name
#   viewer     (0)            ->  watch
#   controller (1)            ->  control        (includes STREAM publishing —
#                                                 a motion producer is a controller)
#   admin      (2)            ->  configure
# Standing composition rules: safety `estop`/`stop` are role-EXEMPT
# (RFC-025/010); OTA rights are NEVER derivable from any tier; serial /
# in-process transports are implicitly `configure` (physical possession, §12.3).
# ---------------------------------------------------------------------------
access_levels:
  0: { name: watch }       # was: viewer
  1: { name: control }     # was: controller
  2: { name: configure }   # was: admin

# ---------------------------------------------------------------------------
# Priority classes (u8) — subscription priority. Lower number sheds FIRST.
# ---------------------------------------------------------------------------
priority_classes:
  0: { name: background }   # bulk/diagnostic; first to shed
  1: { name: normal }       # default telemetry
  2: { name: elevated }     # realtime display feeds
  3: { name: critical }     # never shed: INTENT/ECHO/ESTOP/safety STATE

# ---------------------------------------------------------------------------
# Channel id (u16) ranges.
# ---------------------------------------------------------------------------
channel_id_ranges:
  0x0000:            { name: SESSION, note: "session-scoped frames; never subscribable" }
  0x0001-0x007F:     { name: spec-core, note: "allocated below; spec-governed" }
  0x0080-0x7FFF:     { name: device-defined, note: "hub firmware allocates; described by catalog. RFC-047: the RECOMMENDED allocation shape is the 0xCDSS grid (class nibble 1=STATE/2=STREAM/3=INTENT/4=EVENT/5=STORE, domain nibble device-chosen subsystem, slot byte) — see docs/slopsync/CHANNEL-MAP.md for the worked grid and SlopDrive-32's own renumber. Within this range, 0x7000-0x7FFF is reserved EXPERIMENTAL/VENDOR play space and MUST NEVER appear in a shipped catalog." }
  0x8000-0xFFFF:     { name: reserved }

core_channels:
  0x0001: { name: catalog,        class: STATE, status: active,   note: "catalog meta: etag, chunk count, entry count" }
  0x0002: { name: session-roster, class: STATE, status: reserved, note: "RFC-047 §3: allocated and specified (RFC-018), NOT implemented — no reference catalog builder declares it (see RFC-QUEUE.md deferred ledger, SPEC.md §18). `status: reserved` is the machine-checkable fact the registry never carried before: a channel can be allocated and described on paper without any conformant hub being able to claim it is live. Specified layout: generation u16 + count u8 + flags u8, then 8 packed slots {session_id u32, role u8, flags u8, name str16} = 8x22 + 4 = 180 B, inside the 242 B floor at default_max_clients_ws 8. The str16 name (feasibility pass) is intended to FIX the never-replayed-join-events blocker: a late joiner would learn existing sessions' names from the roster snapshot instead of missed 0x0007 events. Names over 16 B would truncate here; the full name rides 0x0007 while the session lives." }
  0x0003: { name: safety,         class: STATE, status: active,   note: "latched safety word: estop/stop/hold/pause + cause + owner (§11.1); RFC-025 appends manual_override + bypass_limits to the same snapshot (append-only is legal)" }
  0x0004: { name: control-owner,  class: STATE, status: active,   note: "active arbiter source + owning session per source (§11.4)" }
  0x0005: { name: safety-intents, class: INTENT, status: active,  note: "STOP/HOLD/PAUSE/RESUME/ESTOP_CLEAR/ESTOP/TAKEOVER + override/bypass (§11, safety_intent_ops)" }
  0x0006: { name: hub-status,     class: STATE, status: active,   note: "boot_id, heap, uptime, transport stats. NO fw version: RFC-016 puts identity in WELCOME `identity` — one home, no drift." }
  0x0007: { name: session-events, class: EVENT, status: active,   note: "join/leave/takeover/eviction notifications" }
  0x0008: { name: log,            class: EVENT, status: active,   note: "RFC-017: device log in-band — {level u8, tag, hub-ms, message <=128 B} via the `body` sub-map. Bounded drop-oldest with the §9.4 visible drop counter, `background` priority, `watch` access. Declares a replay depth (log_replay_depth_default) so the hub MAY replay its ring tail on grant — the named exception to §9.4's no-replay rule. Retires /api/log; the serial-quiet handoff re-binds from 'first HTTP GET' to 'first log grant'." }
  0x0009: { name: session-admin,  class: INTENT, status: active,  note: "RFC-018: {op: evict, session_id} -> hub GOODBYEs the target with SESSION_EVICTED. `configure` access — and note RFC-027 makes configure reachable BY CEREMONY now (§12.2's 'admin only via the hub's own UI' sentence is struck), so this power is deliberately pairing-reachable." }
  0x000A: { name: pending-pairing, class: STATE, status: active,  note: "RFC-027(a) knock-and-approve: the bounded pending list (pairing_pending_max) as protocol state — {generation u16, count u8, flags u8} + slots {instance_id u64, kind u8, expires_s u16, name str16}. Any `configure` session approves/denies via 0x0009 (session_admin_ops pair_approve/pair_deny); the joiner needs one button and no display. TWO FIELD CLARIFICATIONS made when M4b implemented this: `kind` is the `pairing_modes` BIT that produced the knock (1 knock_approve / 2 pin_proof / 4 push_to_pair), so an approving UI can say HOW the device asked; and the countdown is `expires_s`, NOT ms — pairing_window_default_s is 120, i.e. 120000 ms, which does not fit the u16 the slot layout allocates. Seconds is also the only resolution an approval UI can use. `flags` bit0 = a pairing association window is currently OPEN (RFC-027(c) push-to-pair), which is how window state stays observable in-band for a session that connected before the window opened." }
  0x000B: { name: pairing-events, class: EVENT, status: active,   note: "RFC-027: knock arrived / approved / denied / expired, plus pairing-window open/close. EVENT twin of 0x000A." }
  # RFC-027(4)/029(2) trust ledger. The feasibility pass ruled this a BLOB
  # STORE, never a packed roster — a ledger entry is {instance_id, kind, name,
  # version, first_seen, last_seen, role, state} and only 2-7 of those fit a
  # 242 B snapshot depending on field set. So it follows RFC-021's store shape
  # exactly, which is TWO catalog entries: a static STORE descriptor and a tiny
  # dynamic roster STATE. Every store in the protocol looks like this pair.
  0x000C: { name: paired-devices,        class: STORE, status: active, note: "trust-ledger store descriptor: {store_id, kind 'trust.ledger', capacity paired_devices_max, per_item_max, name_max}. Items are read/revoked by any `configure` session via BLOB_REQ on blob_namespaces.store + the 0x0009 admin surface. Whole encoded ledger stays under trust_ledger_max_bytes (one NVS page)." }
  0x000D: { name: paired-devices-roster, class: STATE, status: active, note: "the 0x000C store's roster: {generation u16, count u8, capacity u8}. On-change, tiny; a generation bump means 're-enumerate' (fetch again over BLOB_REQ). `configure` access — the paired-device list is not open reading." }
  # §9.4's event/state duality rule names e-stop as THE canonical pair — "EVENT
  # for the edge, `safety` 0x0003 for the latch" — and §5.5/§11.2 both require
  # the hub to "emit the EVENT twin". Until M4b there was no channel to emit it
  # ON: 0x0007 session-events is a SESSION-lifecycle vocabulary at `normal`
  # priority, and folding safety edges into it would have merged two unrelated
  # kind spaces, forced the whole channel to `critical`, and made "subscribe to
  # safety edges" impossible without also taking every join/leave. So the twin
  # gets its own channel, which is also what makes the duality rule literally
  # true: 0x0003 is the latch, 0x000E is its edge, same domain, same priority.
  0x000E: { name: safety-events, class: EVENT, status: active, note: "RFC/§9.4 duality: the EVENT TWIN of the `safety` STATE channel (0x0003). Kinds in `safety_event_kinds`; fields ride the scoped `body` (40) sub-map keyed by this channel's own catalog schema (word, cause, owner_session, estop_seq, level). `critical` priority and `watch` access, matching its STATE twin exactly — an edge nobody is allowed to be denied and nobody is allowed to shed. Carries `seq_of_state` (34) naming the 0x0003 frame it corresponds to, which is what lets a client that missed the edge reconcile against the latch it DID receive. Emitted on TRANSITIONS ONLY: a repeated ESTOP frame re-broadcasts the STATE (that is §11.2's loss recovery) but does NOT re-emit the edge, because an edge that did not happen is a lie." }

# ---------------------------------------------------------------------------
# CBOR map integer keys (control plane). Global key space — a key means the
# same thing in every message that uses it. 1–63 core, 64–127 reserved,
# 128+ experimental. Encoded per deterministic profile §5.3.
#
# CONSERVATION RULE (feasibility pass 2026-07-25, binding): per-feature keys
# do NOT get global keys each. They nest in a SCOPED SUB-MAP the way `limits`
# (22) and `probe_result` (26) already do — one global key per feature, its
# interior numbered in its own tiny space defined further down this file
# (`identity_keys`, `blob_keys`, `trust_keys`). This is what kept the v1.0
# base pass at ~7 new global keys instead of ~18, and it is why the 1–63 space
# is expected to outlive the protocol. A new feature that wants five keys gets
# ONE, plus a sub-key section.
# ---------------------------------------------------------------------------
cbor_keys:
  1:  { name: proto_ver,      type: uint,  note: "HELLO/WELCOME: protocol major version" }
  2:  { name: client_kind,    type: tstr,  note: "e.g. webui, c5-remote, mobile, sim, tcode-bridge" }
  3:  { name: client_name,    type: tstr,  note: "human-readable, ≤32 UTF-8 bytes" }
  4:  { name: instance_id,    type: bstr,  note: "8-byte stable client identity (§6.1)" }
  5:  { name: token,          type: bstr,  note: "16-byte pairing token (§12.2); absent = viewer" }
  6:  { name: session_id,     type: uint,  note: "u32, hub-assigned (§6.1)" }
  7:  { name: boot_id,        type: uint,  note: "u32 random per hub boot (§7.2)" }
  8:  { name: catalog_etag,   type: bstr,  note: "8-byte truncated SHA-256 (§8.3)" }
  9:  { name: cfg_gen,        type: uint,  note: "u16 config generation (§4.2)" }
  10: { name: subscriptions,  type: array, note: "of {15:channel,12:rate,13:priority}" }
  11: { name: publishes,      type: array, note: "of {15:channel,12:rate,42:burst} — HELLO wishes and PUBLISH (0x18) renegotiation (RFC-013)" }
  12: { name: rate_hz,        type: float, note: "requested rate; 0 = on-change only" }
  13: { name: priority,       type: uint,  note: "priority class 0–3" }
  14: { name: granted_rate_hz, type: float, note: "GRANT: applied rate after clamp (§10.2)" }
  15: { name: channel_id,     type: uint,  note: "u16" }
  16: { name: code,           type: uint,  note: "NACK/GOODBYE reason code (§16.1)" }
  17: { name: detail,         type: tstr,  note: "optional human-readable diagnostic" }
  18: { name: intent_id,      type: uint,  note: "u16 idempotency id, session-scoped (§9.3)" }
  19: { name: applied,        type: map,   note: "ECHO: post-clamp applied values" }
  20: { name: value,          type: any,   note: "INTENT payload value(s) per catalog schema" }
  21: { name: timestamp,      type: uint,  note: "hub-ms (control plane events)" }
  22: { name: limits,         type: map,   note: "WELCOME: hub limits (max_frame, max_subs, max_clients...)" }
  23: { name: roles,          type: uint,  note: "granted access level (max of session)" }
  24: { name: deadman_ms,     type: uint,  note: "WELCOME: applied deadman timeout for this session" }
  25: { name: deadman_policy, type: uint,  note: "0=stop(decel) 1=hold 2=none — per active-source rules §11.3" }
  26: { name: probe_result,   type: map,   note: "PROBE_REPORT: {bytes, span_ms, loss_pct, rtt_ms} — sub-keys in `probe_result_keys`" }
  27: { name: chunks,         type: array, note: "BLOB_REQ repair: missing chunk indices. (Was 'CATALOG_REQ repair' pre-v1.0; the key is REUSED rather than replaced because catalog transfer is now blob namespace 0 — same meaning, generalized carrier.) Present WITH a full request = MALFORMED (RFC-022.6)." }
  28: { name: pin_proof,      type: bstr,  note: "PAIR_REQ: HMAC-SHA256(PIN, hello-nonce) truncated 16B (§12.2)" }
  29: { name: nonce,          type: bstr,  note: "WELCOME: 8-byte pairing nonce" }
  30: { name: precondition,   type: uint,  note: "INTENT: expected cfg_gen (CAS guard, §9.3)" }
  31: { name: retry_after_ms, type: uint,  note: "NACK BUSY: earliest reconnect time" }
  32: { name: takeover,       type: bool,  note: "safety-intent: forcible source takeover flag (§11.4)" }
  33: { name: event_kind,     type: uint,  note: "EVENT: kind discriminator per catalog entry" }
  34: { name: seq_of_state,   type: uint,  note: "EVENT: seq of the STATE twin frame it corresponds to (§9.4)" }
  35: { name: grants,         type: array, note: "WELCOME: batch grant results — array of {13:priority, 14:granted_rate_hz, 15:channel_id} (§6.3, §10.2)" }
  36: { name: granted_publishes, type: array, note: "WELCOME / PUBLISH result: granted STREAM-ingress publishes — array of {14:granted_rate_hz, 15:channel_id, 42:burst} (§6.3, §10.5). Omitted when empty." }
  # ---- public v1.0 additions (feasibility pass: 7 keys, all sub-mapped) ----
  37: { name: identity,       type: map,   note: "WELCOME: hub identity (RFC-016) — sub-keys in `identity_keys`. Capability discovery is CATALOG introspection, not a list here: a feature exists iff its channels exist." }
  38: { name: blob,           type: map,   note: "BLOB_REQ / BLOB_CHUNK / store CRUD intents: which blob, and its item fields (RFC-021) — sub-keys in `blob_keys`." }
  39: { name: trust,          type: map,   note: "HELLO + WELCOME + AUTH: identity proof, signature material, token presentation, pairing modes (RFC-029/027) — sub-keys in `trust_keys`. Absent = the potato path: bearer token, no crypto, unchanged v1-draft handshake cost." }
  40: { name: body,           type: map,   note: "EVENT: the kind-specific fields. Integer keys come from the CHANNEL'S CATALOG `schema`, exactly as INTENT's `value` (20) does — NOT from this global space. Grammar fix from the feasibility pass: with kind-specific fields at the top level, every device-authored EVENT channel (the motion-anomaly channel!) would have needed a registry PR to name its own fields — the precise coupling the self-describing catalog exists to prevent." }
  41: { name: intent_seq,     type: uint,  note: "NACK: seq of the frame being rejected (RFC-001). Hubs SHOULD populate it whenever a specific inbound frame provoked the NACK; clients MUST tolerate its absence. Without it a client with two intents in flight on ONE channel cannot tell which was refused." }
  42: { name: burst,          type: float, note: "publishes / granted_publishes ENTRY maps: token-bucket capacity in samples, decoupled from rate (RFC-013). Default = granted rate (today's behavior). Clamped to rate x max_burst_multiple and echoed like every wish. Exists because §10.5 made rate double as bucket depth, so a 2-4/s segment sender with a 25/s peak had to declare 30 Hz — lying to admission control to buy burst." }
  43: { name: reboot_in_ms,   type: uint,  note: "ECHO `applied` (19): this accepted intent commits by rebooting, in about this many ms (RFC-020). The hub then GOODBYEs every session with REBOOTING; `boot_id` change handles the rest." }
  44: { name: deadman_wish_ms, type: uint, note: "HELLO: requested deadman window (RFC-038). The hub clamps into [deadman_min_ms, deadman_max_ms] (a hub MAY clamp tighter) and echoes the APPLIED value via the existing key 24 — post-clamp echo, zero new response plumbing. Exists because a client that KNOWS its liveness cadence is coarse (a browser whose background-tab timers are throttled, a BLE client on a slow connection interval) could not ask for a window it can actually honor; §11.3's loss policy is untouched — this negotiates WHEN the deadman fires, never WHAT it does." }
  45: { name: curve_family,   type: uint,  note: "publishes / granted_publishes ENTRY maps: which `curve_families` smoothness class the segment stream describes (RFC-030). Wish rides HELLO or PUBLISH (0x18) like `burst`, so a sender switching interpolators mid-session renegotiates without a reconnect; the GRANT echo carries the EFFECTIVE family — post `curve_policy` override — so a client can tell 'honored' from 'downgraded'. Absent = unspecified = today's behavior. RFC-049b: `requested_curve_family` (48) rides the SAME entry map echoing the original wish verbatim, so the honored-vs-downgraded read is a direct comparison of two present keys, not an inference from what the client remembers sending." }
  46: { name: ws_port,        type: uint,  note: "WELCOME: the hub's own WebSocket listening port (RFC-046 §3). Present on every binding but load-bearing over BLE — it is the in-band endpoint disclosure a BLE-connected client needs to hop to WS (RFC-043's auto-upgrade). Also closes the sim's hub-identity gap for WS-side clients: the same key tells a WS client what the hub believes its own endpoint is. 0 = none (no WS listener right now)." }
  47: { name: ipv4,           type: uint,  note: "WELCOME: the hub's own IPv4 address (RFC-046 §3), packed big-endian into one u32 (e.g. 192.168.1.229 = 0xC0A801E5) — there is no bstr(4) here because a plain integer makes '0 = none' the same natural sentinel 0.0.0.0 already is. Read alongside `ws_port` for the BLE→WS upgrade hop. 0 = none." }
  48: { name: requested_curve_family, type: uint, note: "publishes / granted_publishes ENTRY maps (RFC-049b): echoes the client's `curve_family` (45) WISH verbatim, unmodified by `curve_policy`. Exists alongside the existing effective value at key 45 so a downgrade is a visible FACT (both numbers present, compare them) rather than an inference a client has to reconstruct from what it originally sent. Present only when a curve_family wish was made; a hub with no curve-family opinion omits both keys exactly as before this RFC. Implementation: Phase D (RFC-049)." }
# 49–63 free in the core space. 64–127 reserved. 128+ experimental.

# ---------------------------------------------------------------------------
# WELCOME `limits` (key 22) sub-map integer keys — a separate tiny key space
# scoped to that nested map only (NOT the global cbor_keys space).
# ---------------------------------------------------------------------------
welcome_limits_keys:
  1: { name: max_frame,        note: "largest frame this hub accepts, bytes" }
  2: { name: max_subscriptions, note: "per-session subscription cap" }
  3: { name: retained_pending, note: "count of retained STATE pushes that will follow WELCOME" }
  4: { name: max_subscriptions_per_frame, note: "RFC-033.3: most subscription wishes one SUBSCRIBE (or HELLO) frame may carry. Before this was advertised, a client could only find the reference hub's 16-wish decode cap by binary-searching against a live machine — which two clients did, one night each." }

# ---------------------------------------------------------------------------
# PROBE_REPORT `probe_result` (key 26) sub-map integer keys — scoped key
# space local to that nested map (§6.4).
# ---------------------------------------------------------------------------
probe_result_keys:
  1: { name: bytes_received, note: "bytes received during the probe burst" }
  2: { name: span_ms,        note: "wall time of the burst as observed by the client" }
  3: { name: loss_pct_x100,  note: "loss percentage x100 (2 decimal fixed-point)" }
  4: { name: rtt_ms,         note: "measured round-trip time, ms" }

# ---------------------------------------------------------------------------
# WELCOME `identity` (key 37) sub-map integer keys — RFC-016. Strings are
# legal here (control plane); this is tier 1 of RFC-026's three string tiers.
# There is exactly ONE home for hub identity, deliberately: 0x0006 hub-status
# had `fw version` in its note and the feasibility pass struck it, because two
# homes drift and clients then disagree about which machine they are talking
# to. Session-layer capabilities (pairing modes) live in `trust`; CHANNEL
# capabilities are catalog introspection.
# ---------------------------------------------------------------------------
identity_keys:
  1: { name: product,    note: "tstr: product/model identifier, e.g. 'slopdrive-32' (<=32 B)" }
  2: { name: fw_version, note: "tstr: hub firmware version, e.g. '2.1.47' (<=24 B). Retires the mDNS-TXT-only exposure that made the MFP plugin label devices 'boot 0x...'. A change here SHOULD be surfaced to the user (RFC-029.3)." }
  3: { name: hub_name,   note: "tstr: operator-assigned machine name (<=32 B). Writable as a str16/str32 setting (RFC-026) where the hub offers one." }
  4: { name: info,       note: "map: OPTIONAL device-defined extras (hardware rev, build date...). Keys are device-defined tstr; the protocol never interprets them. Depth: WELCOME map -> identity map -> info map = 3, one under the §5.3 cap." }
  5: { name: hub_instance_id, note: "uint (u64): RFC-048, operator veto of an RFC-046 decision. DURABLE hub identity — generated once and NVS-persisted, survives every reboot and firmware update (only a factory reset regenerates it) — as opposed to `boot_id` (cbor_keys 7, §6.1/§7.2), which is a FRESH random value EVERY boot and exists only to fence stale per-boot state. Distinguishes THIS PHYSICAL HUB from any other, across time. Present in WELCOME `identity` (37) for any hub that persists one; absent = the hub has no durable identity yet (a fresh dev build, a non-persisting simulator) and a client MUST tolerate its absence exactly as it tolerates the rest of `identity` (§6.3). Also the value DISCOVER_REPLY (0x1F, §13.8) now carries as `hub_instance_id`, replacing that frame's original `boot_id`-based disambiguator (see the `frame_types` 0x1F note) — a boot-scoped id could not deduplicate 'two hubs sharing a name' across a reboot, which was the field's whole job." }

# ---------------------------------------------------------------------------
# `blob` (key 38) sub-map integer keys — RFC-021. One vocabulary shared by:
#   * BLOB_REQ (0x1A)      — namespace/store_id/slot/generation select WHAT;
#                            top-level `chunks` (27) makes it a repair request
#   * BLOB_CHUNK (0x1B)    — raw plane, but its fixed header carries the SAME
#                            identity fields, named here so the two stay aligned
#   * store CRUD INTENTs   — save/load/delete/rename carry slot/name/kind/payload
# `payload` is OPAQUE to the protocol layer: a bstr the spec NEVER decodes.
# RFC-028's depth and allocation budget explicitly does NOT extend inside it;
# a client that decodes one has stepped above the protocol boundary. Imports
# larger than max_frame ride BLOB chunks, never fragmented INTENTs.
# ---------------------------------------------------------------------------
blob_keys:
  1:  { name: ns,          note: "uint: which blob space — see `blob_namespaces`. (Named `ns`, not `namespace`: the generated C++ constant would otherwise be a keyword. Prose and CDDL may say 'namespace'.)" }
  2:  { name: store_id,    note: "uint u8: which store within blob_namespaces.store; absent/0 for the catalog namespace. Declared by the store's STORE-class catalog entry." }
  3:  { name: slot,        note: "uint u8: item index within the store, 0..capacity-1" }
  4:  { name: generation,  note: "uint u16: the roster generation this request/response is consistent with. Lets a client notice its enumeration went stale mid-transfer." }
  5:  { name: name,        note: "tstr: item name, <= the store's declared name_max" }
  6:  { name: kind,        note: "tstr: namespaced payload kind, e.g. 'pattern.frayd'. The hub validates kind + size on import and NACKs INVALID_VALUE; it never inspects the payload itself." }
  7:  { name: payload,     note: "bstr: the opaque item document (<= preset_item_max_bytes / the store's per_item_max). Present on save-with-payload (= import); absent on save means 'capture CURRENT live state'." }
  8:  { name: chunk_index, note: "uint: 0-based index of this chunk" }
  9:  { name: chunk_count, note: "uint: total chunks in this transfer" }
  10: { name: total_bytes, note: "uint: total encoded byte length being transferred (lets a receiver size/reject before assembling — RFC-028 no-unbounded-allocation)" }

# ---------------------------------------------------------------------------
# `trust` (key 39) sub-map integer keys — RFC-029 (+ RFC-027 mode advert).
# Present in HELLO (client_ver, client_nonce, sig_request), WELCOME
# (welcome_sig, pairing_modes), AUTH (token_proof, presentation_mode) and
# PAIR_GRANT (hub_pubkey).
#
# WEIGHT COVENANT: every key here is OPTIONAL and the mandatory client floor
# is unchanged from v1-draft — same parser, zero required crypto, 24 bytes of
# stored identity. A coin-cell remote omits the whole map and pairs by
# physical ceremony.
# ---------------------------------------------------------------------------
trust_keys:
  1: { name: client_ver,        note: "tstr: HELLO — client software version (<=24 B). The CHANGE TRIPWIRE: an observed version change drops a paired device to RECOGNIZED-PENDING (admitted at `watch`, granted role suspended, re-approval surfaced to configure sessions). HONESTY CLAUSE, normative: self-reported, therefore a tripwire and NOT attestation — a deliberately malicious update lies and keeps its token. The real bounds are role scoping, instant revocation, roster visibility and the role-exempt safety ops." }
  2: { name: client_nonce,      note: "bstr: HELLO — 8 bytes of CLIENT entropy. The hub signs client_nonce || session_id || boot_id. This was a feasibility-pass BLOCKER: without client entropy the WELCOME signature is replayable from one captured handshake and an evil twin passes verification." }
  3: { name: sig_request,       note: "bool: HELLO — 'please sign my nonce'. Signing is ON REQUEST because the S3 has no ECC accelerator (mbedtls software ECDSA: sign ~30-80 ms, one uninterruptible call, never inline in a WS handler), so potato handshakes must stay instant. Absent/false = no signature, no cost. A request is NOT a promise: a hub with no keypair answers with silence, and silence is a conformant answer — only a client that PINNED a key (which it can only have received from that machine's own PAIR_GRANT) is entitled to read silence as failure, after hub_sig_timeout_ms." }
  4: { name: hub_pubkey,        note: "bstr: PAIR_GRANT — SEC1-compressed P-256 public key (33 B). Delivered AT THE PAIRING CEREMONY, i.e. TOFU anchored at the moment physical presence was proven. P-256 because WebCrypto can verify it — the browser participates." }
  5: { name: welcome_sig,       note: "bstr: WELCOME or HUB_SIG (0x1D) — deterministic ECDSA-P256 (RFC 6979) signature over the 16-byte string client_nonce(8) || session_id(u32 LE) || boot_id(u32 LE). A clone machine copies every identity string and fails this; the client MUST surface 'not your machine' and withhold intents. Potato clients paired by physical ceremony MAY skip verification. TWO DELIVERY POINTS, ONE MEANING: inline in WELCOME where a hub can sign without stalling its own tick, otherwise deferred in HUB_SIG once the hub's own low-priority worker has produced it. Signature material and client handling are identical either way; a client accepts whichever arrives first and ignores a second." }
  6: { name: token_proof,       note: "bstr: AUTH — HMAC-SHA256(token, WELCOME nonce) truncated to 16 B. Costs ONE extra round trip per connect; that is the honest price. The 'previous-session nonce' shortcut was DROPPED by the feasibility pass as replay-unsafe (undefined rotation point, and §6.3 makes a successful replay EVICT the real client)." }
  7: { name: presentation_mode, note: "uint: how the client presents its token — 0 = bearer (raw 16 B in HELLO; legal, the potato floor stays a memcpy), 1 = proof (AUTH, RECOMMENDED for anything with SHA-256, i.e. everyone but coin cells). v1 transports are cleartext, so bearer is sniffable by a passive LAN observer; the roster records which mode a device uses, making security posture visible." }
  8: { name: pairing_modes,     note: "uint: WELCOME — BITMASK of `pairing_modes` this hub currently offers, RE-EVALUATED PER SESSION so a mode that is only transiently available (RFC-027(c)'s push-to-pair window) is advertised only while it is actually open. RFC-027.3 said 'WELCOME limits/identity map'; it lands here instead because it is session-security capability, and `limits` is sized caps while `identity` is who-you-are. Window state is thus observable in-band by any watch session." }

# ---------------------------------------------------------------------------
# Token PRESENTATION modes (u8) — `trust`.presentation_mode (RFC-029 item 6),
# recorded per device in the trust ledger so security posture is VISIBLE.
#
# THE WEIGHT COVENANT LIVES HERE. `bearer` is the mandatory floor and the
# default: raw token in HELLO, one memcpy, zero crypto, one round trip. `proof`
# is RECOMMENDED for anything that already has SHA-256 (browser/WebCrypto, C#,
# every ESP32) and is never required of anyone.
# ---------------------------------------------------------------------------
presentation_modes:
  0: { name: bearer, note: "raw 16-byte token in HELLO. LEGAL, DEFAULT, and the potato floor — a coin-cell client does exactly this and nothing more. v1 transports are cleartext, so a passive LAN observer who captures one HELLO owns the credential until it is revoked; §12.1 excludes that attacker, and this mode accepts that ceiling knowingly." }
  1: { name: proof,  note: "HMAC-SHA256(key = token, message = the WELCOME nonce) truncated to 16 B, presented in an AUTH (0x1C) frame after WELCOME. The token itself NEVER crosses the wire, so a sniffer captures a one-time proof and not the credential. Costs exactly one extra round trip per connect (HELLO -> WELCOME -> AUTH -> GRANT); the client is at `watch` in between, which is the correct posture for a client that has not yet proved anything. The 'reuse the previous session's nonce to skip the round trip' shortcut was DROPPED as replay-unsafe — see trust_keys.token_proof." }

# ---------------------------------------------------------------------------
# Trust-ledger ITEM key space (RFC-029 item 2, RFC-027.4) — the CBOR map that
# encodes ONE paired device, carried as a BLOB item of the `paired-devices`
# STORE (0x000C) in blob_namespaces.store.
#
# WHY THIS IS REGISTERED AT ALL, when RFC-021 says store payloads are opaque
# bstr the protocol layer never decodes: preset payloads are DEVICE content and
# genuinely opaque. The trust ledger is PROTOCOL content — RFC-029 names its
# fields, any configure client must render and act on them, and "revoke device
# 3" has to mean the same thing on every hub. So the store MACHINERY is reused
# verbatim (chunking, repair, generation, caps — all free) while this one
# store's item grammar is agreed here. A hub with no trust ledger simply never
# declares the 0x000C entry.
#
# BUDGET: 8 + 16 + 16 + 24 + 4 + 4 + 4x1 byte fields ~= 96 B encoded, x
# paired_devices_max (8) ~= 770 B, inside trust_ledger_max_bytes (1900, one NVS
# page). That is the whole reason this is a blob store and not a packed STATE
# roster — the feasibility pass measured 2-7 entries per 242 B snapshot.
# ---------------------------------------------------------------------------
trust_ledger_keys:
  1:  { name: instance_id,       note: "bstr: the device's 8-byte stable identity (§6.1) — the ledger's primary key, and the value a `session_admin_ops` revoke/pair_approve names." }
  2:  { name: kind,              note: "tstr: the `client_kind` this device presented (<=16 B, HELLO key 2). Recorded so a roster can say 'mfp-plugin' rather than a hex blob." }
  3:  { name: name,              note: "tstr: the `client_name` this device presented (<=16 B here; HELLO allows 32 and the ledger truncates, same rule as the 0x0002 roster's str16)." }
  4:  { name: version,           note: "tstr: the `trust`.client_ver observed when the role was last approved (<=24 B). The value the RFC-029 item-2 tripwire compares each HELLO against. Absent/empty means the device never reported one, and a device that reports NO version can never trip the wire — stated plainly because it is a real gap, not an oversight." }
  5:  { name: first_seen,        note: "uint: UNIX epoch seconds when this device was first paired, or 0 for unknown. ZERO IS THE HONEST DEFAULT AND WILL BE COMMON: the protocol's only clock is hub-boot-relative and wraps in ~71 minutes (§7.2), so a hub can fill this in only if the APPLICATION has a wall clock (SNTP) and pushes it in. The library never invents one." }
  6:  { name: last_seen,         note: "uint: UNIX epoch seconds of the most recent HELLO from this device, or 0 for unknown. Same wall-clock caveat as first_seen." }
  7:  { name: role,              note: "uint: the granted `access_levels` value. While `state` is recognized_pending this is the SUSPENDED role — what the device gets back if a configure session re-approves it, not what it currently has." }
  8:  { name: state,             note: "uint: a `trust_states` value." }
  9:  { name: presentation_mode, note: "uint: the `trust`.presentation_mode this device last used (0 bearer / 1 proof). RFC-029.6 requires the roster to record it: a device pairing over cleartext with a raw bearer token has a different security posture than one presenting an HMAC proof, and posture the operator cannot SEE is posture the operator cannot fix." }
  10: { name: pairing_mode,      note: "uint: the single `pairing_modes` BIT this device paired through (1 knock_approve / 2 pin_proof / 4 push_to_pair). The audit trail RFC-027 leans on instead of a hard tier ceiling: a configure grant issued through a push-to-pair window is visible as exactly that." }

# ---------------------------------------------------------------------------
# Blob namespaces (u8) — `blob`.namespace (RFC-021). ONE transfer verb for the
# whole protocol instead of a per-feature clone of the chunking machinery.
# 0–127 spec-governed, 128–255 device-defined.
# ---------------------------------------------------------------------------
blob_namespaces:
  0: { name: catalog, note: "the hub's channel catalog (§8.4). store_id/slot absent. This is the ONLY namespace with a READY concept (CATALOG_READY 0x19) — you cannot decode STATE without the catalog, but nothing gates on a preset." }
  1: { name: store,   note: "items in a catalog-declared STORE-class channel: store_id picks the store, slot picks the item. Presets, saved positions, limit profiles, recordings, the trust ledger — all the same machinery, for free. Unused is unproblem." }

# ---------------------------------------------------------------------------
# session-events channel (0x0007) event_kind values (§9.4, §11.4).
#
# Device-authored EVENT channels enumerate their own kinds in their catalog
# entry; a SPEC-CORE channel's kinds must be agreed here or hub and client
# will disagree. The two other spec-core EVENT channels (0x0008 log,
# 0x000B pairing-events) get their own kind tables directly below.
# ---------------------------------------------------------------------------
session_event_kinds:
  1: { name: takeover,       note: "control source ownership transferred (§11.4)" }
  2: { name: session_joined, note: "a session reached GRANTED" }
  3: { name: session_left,   note: "a session ended (any reason)" }
  4: { name: session_stale,  note: "RFC-042: a session's silence exceeded its liveness window (deadman for a source-owner, idle reaping otherwise) and it was marked STALE rather than torn down — slot, session_id, and grants are RETAINED; any owned source was released (unconditionally, latching nothing per RFC-045). Body carries the affected session_id, same shape as `takeover`." }
  5: { name: session_resumed, note: "RFC-042: a STALE session returned to LIVE, either by any frame arriving on its still-attached transport (§6.6: any received frame is proof of life) or by a fresh HELLO reattaching a new transport to the same session identity (§6.3 migration path). Body carries the affected session_id." }

# ---------------------------------------------------------------------------
# log channel (0x0008) event_kind values (RFC-017).
#
# ONE KIND: a log EVENT only ever announces "a line arrived" — the per-field
# content (level/tag/hub-ms/message) rides `body` (key 40), schema'd by the
# channel's own catalog entry exactly like every other EVENT (device-authored
# or spec-core; see cbor_keys[40]'s note). A "dropped-entries" NOTIFICATION
# kind was considered and rejected: §9.4 already gives EVERY EVENT channel a
# generic visible drop counter (`events_dropped` on hub-status 0x0006, per
# §9.4/§16.2) — a per-channel "dropped" kind here would duplicate that home,
# the same one-home reasoning RFC-016 already applied to fw_version. SlopLog's
# OWN ring-level loss count (a record dropped before it ever became a wire
# EVENT — `sloplog::Record::lost`) is carried honestly as a `body` field on
# the next entry that DOES get published (mirroring what SerialSink already
# prints, "(+N lost)") — that is catalog-schema territory, not a registry
# event_kind.
# ---------------------------------------------------------------------------
log_event_kinds:
  1: { name: entry, note: "a log line was published (fields ride `body`: level, tag, hub-ms, message)" }

# ---------------------------------------------------------------------------
# pairing-events channel (0x000B) event_kind values (RFC-027/029). EVENT twin
# of pending-pairing STATE (0x000A) and the paired-devices store (0x000C/D).
# A generic client renders these as notifications; none of them is a safety
# latch, so none needs a STATE twin under §9.4's duality rule.
# ---------------------------------------------------------------------------
pairing_event_kinds:
  1: { name: knocked,            note: "a PAIR_REQ joined the pending list (0x000A) — knock-and-approve or PIN mode (RFC-027.2)" }
  2: { name: granted,            note: "a pending knock (or an existing device's re-approval) was granted a role, via PAIR_GRANT or the 0x0009 admin surface" }
  3: { name: denied,             note: "a pending knock was denied by a `configure` session" }
  4: { name: expired,            note: "a pending knock's window elapsed unanswered (pairing_window_default_s)" }
  5: { name: window_opened,      note: "a pairing association window opened (push-to-pair boot gesture, or a mode newly advertised in `trust`.pairing_modes)" }
  6: { name: window_closed,      note: "the pairing association window closed" }
  7: { name: revoked,            note: "a paired device's token was revoked from the trust ledger (RFC-018 admin surface, store 0x000C)" }
  8: { name: recognized_pending, note: "RFC-029 item 2: a paired device's observed `client_ver` changed; state dropped trusted -> RECOGNIZED-PENDING (admitted at watch, granted role suspended pending re-approval)" }

# ---------------------------------------------------------------------------
# safety-events channel (0x000E) event_kind values (§9.4 duality, §5.5, §11.2).
#
# THE EDGE HALF of the safety pair. 0x0003 answers "what is latched right now";
# these answer "something just changed, and here is what". A client that has
# both never has to poll and never has to infer a transition by diffing
# snapshots it may have been shed out of.
#
# Emitted on TRANSITIONS ONLY. Repeats of an already-latched ESTOP re-broadcast
# the STATE — that is §11.2's only loss-recovery mechanism and it must keep
# working — but they do NOT re-emit the edge.
#
# Deliberately NOT here: a kind for the RFC-025c `modes` byte (manual override /
# limit bypass). Those are latched MODES, not stop edges; they live in the same
# snapshot for rendering reasons, and giving them an edge kind would imply an
# operator action a hub-side reconciliation (an e-stop dropping override as a
# side effect) did not have. If a mode edge is ever genuinely wanted it is an
# additive kind here, which is normal evolution.
# ---------------------------------------------------------------------------
safety_event_kinds:
  1: { name: estop_latched, note: "the ESTOP bit went 0 -> 1 (§5.5). `body` carries word/cause/owner_session/estop_seq. Cause is a `safety_causes` value; `estop_seq` is the §5.5 per-INITIATION sequence, so repeats of one initiation share it." }
  2: { name: estop_cleared, note: "the ESTOP bit went 1 -> 0 via §11.2's guarded clear (`safety_ops::estop_clear` + the hub's and delegate's preconditions). Clearing never restarts motion; this edge says the latch is gone, never that the machine moved." }
  3: { name: stop_latched,  note: "one or more of STOP / HOLD / PAUSE went 0 -> 1. `body.level` is the bitmask of the bits that NEWLY set (safety word bits 1/2/3), so one edge reports one operator action even when it sets several. Cause distinguishes an operator `stop` (user) from a §11.3 deadman (deadman) from a teardown loss policy (session_loss) — which is the whole reason this edge is worth having: all three look identical in the snapshot." }
  4: { name: stop_cleared,  note: "one or more of STOP / HOLD / PAUSE went 1 -> 0 (`resume`, or a STOP cleared by an accepted new motion intent per §11.1). `body.level` is the bitmask of the bits that NEWLY cleared." }

# ---------------------------------------------------------------------------
# Trust-ledger entry states (u8) — the `state` field of a paired-devices item
# (RFC-029 item 2). A revoked device has NO entry, so revocation is an absence,
# never a third state: the ledger is the authorization list, and something on
# the authorization list that is not authorized is a footgun.
# ---------------------------------------------------------------------------
trust_states:
  0: { name: trusted,            note: "paired, and the version observed at the last HELLO matches the version recorded when the role was approved. The granted role applies in full." }
  1: { name: recognized_pending, note: "RFC-029 item 2's tripwire fired: this device presented a DIFFERENT `client_ver` than the ledger recorded. The session is admitted at `watch`, the granted role is SUSPENDED (not revoked), and a re-approval is surfaced to configure sessions via 0x000A/0x000B. HONESTY CLAUSE, normative: the version is SELF-REPORTED, so this catches an honest update and nothing else — a deliberately malicious update lies about its version and keeps its token. The real bounds on a hostile client are role scoping, instant revocation, roster visibility and the role-exempt safety ops. Do not let a UI imply this is attestation." }

# ---------------------------------------------------------------------------
# Log severity levels (u8) — log channel (0x0008) `body.level` (RFC-017).
#
# MIRRORS lib/sloplog's `sloplog::Level` enum NUMBER-FOR-NUMBER so the
# firmware bridge (AppLog -> log EVENT) is a straight `uint8_t(level)` cast,
# never a translation table. `sloplog::Level` also declares `Off = 6`, but
# Off is a FLOOR sentinel (setFloor() / a sink's floor argument) — push()/
# logf() reject any record at or above it, so no wire record's level field
# can ever read 6. It is deliberately NOT registered here: registering it
# would imply a log line can arrive "at Off", which is a contradiction.
# ---------------------------------------------------------------------------
log_levels:
  0: { name: trace, note: "sloplog::Level::Trace — SLOGT" }
  1: { name: debug, note: "sloplog::Level::Debug — SLOGD" }
  2: { name: info,  note: "sloplog::Level::Info — SLOGI" }
  3: { name: warn,  note: "sloplog::Level::Warn — SLOGW" }
  4: { name: error, note: "sloplog::Level::Error — SLOGE" }
  5: { name: fatal, note: "sloplog::Level::Fatal — SLOGF" }

# ---------------------------------------------------------------------------
# safety-intents channel (0x0005) op codes — `value` map key 1 (§11).
#
# ROLE EXEMPTION (RFC-025b, normative): `estop` (6) and `stop` (2) are
# role-EXEMPT — ANY session may send them, including `watch`. This is §11.2's
# "safety outranks authorization" generalized: the wrong guess here means the
# person standing in the room cannot stop the machine. Every other op requires
# `control`. Exempt ops are still §9.3 rate-limited; watch-tier stop spam is a
# named, bounded, ACCEPTED risk in §12.1.
#
# Per-op access is expressible in the catalog as of v1.0 (schema-field gains
# optional `access`) — without it, role-exempt ops would force the whole
# channel to `watch` access and a generic RFC-009 renderer would offer
# hold/pause/takeover to every viewer, discovering otherwise only by NACK.
# That violates gray-never-hide.
# ---------------------------------------------------------------------------
safety_intent_ops:
  1:  { name: estop_clear,  note: "clear the ESTOP latch (§11.2 conditions apply; NACK CLEAR_REFUSED otherwise). Requires `control`." }
  2:  { name: stop,         note: "controlled decel stop (§11.1). ROLE-EXEMPT." }
  3:  { name: hold,         note: "position hold (§11.1). Requires `control`. The HUB latches all four levels in 0x0003 — delegate acceptance is what triggers the latch; a hub whose delegate does not implement this NACKs UNSUPPORTED_OP, which is discoverable and honest (RFC-025a)." }
  4:  { name: pause,        note: "pattern pause (§11.1). Requires `control`." }
  5:  { name: resume,       note: "resume from HOLD/PAUSE (§11.1). Requires `control`." }
  6:  { name: estop,        note: "ASSERT e-stop (RFC-010). ROLE-EXEMPT. The hub treats it exactly as a valid 0xE5 frame: latch, cause=user, publish 0x0003, EVENT twin. The raw 0xE5 frame stays as the deframed-path/relay guarantee; this op is the trivially-implementable client path — without it the red button silently degrades to a decel-stop, which is why this gated port-81 deletion." }
  7:  { name: override_on,  note: "engage manual override (RFC-025c). Requires `control`. Override/bypass are SAFETY-domain state, not rail-UI state: they render near the rail but other surfaces need them, so they live in the 0x0003 snapshot (appended byte) and are written here." }
  8:  { name: override_off, note: "release manual override. Requires `control`." }
  9:  { name: bypass_on,    note: "engage limit bypass (RFC-025c). Requires `control`. The per-move `bypass` key on a motion INTENT is unaffected and stays as-is." }
  10: { name: bypass_off,   note: "release limit bypass. Requires `control`." }

# ---------------------------------------------------------------------------
# session-admin channel (0x0009) `value` map key 1 — the ADMIN VERB SPACE
# (RFC-018 eviction + RFC-027/029 trust administration).
#
# ONE CHANNEL, NOT THREE. Eviction, pairing approval and revocation are all
# "an authorized operator changing who may do what", so they share one access
# floor (`configure`), one §9.3 rate limiter, one idempotency ring, and one
# place a generic RFC-009 renderer looks to build an admin surface. Splitting
# them would have burned two more spec-core channel ids to re-implement the
# same dispatch three times, and would have let a hub end up authorizing
# "approve a pairing" differently from "evict a session" — which is one
# authorization decision wearing two hats.
#
# THE TRUSTED SURFACE IS A TIER, NOT AN APP (operator ruling, RFC-027): nothing
# anywhere may special-case "the WebUI approves". Any `configure` session —
# phone, CLI, another machine, the WebUI — reaches every op here, and §12.2's
# old "admin granted only via the hub's own UI" sentence is struck by RFC-027
# precisely so that is true.
#
# CEILING RULING (operator, 2026-07-25): a configure session may grant UP TO
# ITS OWN TIER, configure included. That is conventional admin behavior; the
# audit trail is the paired-device roster (0x000C/D records which mode and
# which role), not a hard ceiling that would make the first admin unable to
# make a second.
#
# `value` map: key 1 = op (this table), plus the op's own arguments —
# key 2 = session_id (u32), key 3 = instance_id (bstr 8), key 4 = role
# (access_levels). Those are the CHANNEL'S OWN catalog schema keys, exactly
# like every other INTENT channel; they are not global cbor_keys.
# ---------------------------------------------------------------------------
session_admin_ops:
  1: { name: evict,        note: "RFC-018: GOODBYE the session named by `session_id` with SESSION_EVICTED. Runs the full §6.8/RFC-005 teardown — the evicted session's source ownership is released under its §11.3 loss policy exactly as if it had crashed, because 'no unmonitored path to motion' does not get an exception for admin actions. Evicting your OWN session is legal and is just a rude GOODBYE to yourself." }
  2: { name: pair_approve, note: "RFC-027(a): approve the pending knock named by `instance_id` at `role`, issuing PAIR_GRANT {token, role} to the knocker. ALSO the RFC-029 item-2 RE-APPROVAL verb: applied to a device in `recognized_pending` it re-records the observed version and restores the suspended role — approving a knock and re-trusting a changed device are the same decision ('this identity may do this'), so they are the same op rather than two that could drift." }
  3: { name: pair_deny,    note: "RFC-027(a): drop the pending knock named by `instance_id` without issuing a token; emits pairing_events `denied`. On a `recognized_pending` device this is a REVOKE (op 4) in effect — deny means 'no', and leaving a suspended entry in the ledger after an operator said no would be a lie the roster tells forever." }
  4: { name: revoke,       note: "RFC-027(4)/029: delete `instance_id` from the trust ledger. Revocation is PROTOCOL, not a WebUI feature — that is the entire point of putting it here. Takes effect at the next HELLO (an already-live session keeps the role it was admitted with until it reconnects or is evicted; use evict to end it now). Emits pairing_events `revoked`." }

# ---------------------------------------------------------------------------
# Safety cause codes (u8) — ONE taxonomy, two wire homes: the ESTOP frame's
# `cause` byte (§5.5, frame type 0xE5) and the 0x0003 safety STATE snapshot's
# latched `cause` field (§11.1: "cause (user / deadman / fault / relay)").
# An ESTOP's initiating cause and the cause a STOP/ESTOP is CURRENTLY latched
# for are the same four-then-five-value enum.
#
# RFC-022.3: value 4 `session_loss` is NEW. Before it, `hub_impl.hpp` had no
# distinct code for "the owning session went away" — GOODBYE, rude detach,
# either eviction, and slot reuse (RFC-005's teardownSession(), §6.8) all
# hard-coded cause=1 (deadman). That is a real bug, not just a naming gap: an
# operator closing their browser tab got blamed on a deadman-TIMEOUT in every
# subscriber's UI and log line. `deadman` (1) now means ONLY "the §11.3
# silence window actually elapsed"; every other teardown path latches
# `session_loss` (4) instead.
# ---------------------------------------------------------------------------
safety_causes:
  0: { name: user,         note: "operator-initiated (physical button, UI, safety-intents `estop`/`stop`) — §5.5" }
  1: { name: deadman,      note: "§11.3 deadman window actually elapsed (silence timeout, not some other way the session ended — see session_loss)" }
  2: { name: fault,        note: "hub/driver-detected fault" }
  3: { name: relay,        note: "relay-originated (segment-local safety event) — §5.5" }
  4: { name: session_loss, note: "RFC-022.3: the owning session ended by ANY non-deadman teardown path (GOODBYE, rude detach, either eviction, slot reuse) — §6.8 / RFC-005's teardownSession() loss policy. Was misreported as cause=deadman before this value existed." }

# ---------------------------------------------------------------------------
# NACK / GOODBYE reason codes (u16, ranged).
#
# ONE SPACE, NOT TWO (RFC-022.2, ruled by the feasibility pass): GOODBYE
# `code` values are drawn from THIS table. A separate `goodbye_codes` space
# was considered and rejected because §4.3's unknown-code handling is a RANGE
# fallback ("0x04xx means a safety refusal I don't recognize") — two
# overlapping spaces make the range of an unknown code ambiguous, so a
# forward-compatible receiver could not classify it. Codes usable as a GOODBYE
# reason say so in their note. (Two shipped clients had already hand-reused
# 0x0107 for this; the registry was simply behind them.)
# ---------------------------------------------------------------------------
nack_codes:
  # 0x00xx — protocol
  0x0000: { name: MALFORMED,            note: "undecodable frame/CBOR" }
  0x0001: { name: UNSUPPORTED_VERSION,  note: "HELLO proto_ver not servable" }
  0x0002: { name: FRAME_TOO_LARGE,      note: "exceeds negotiated max_frame" }
  0x0003: { name: PROFILE_VIOLATION,    note: "CBOR not in deterministic profile" }
  # 0x01xx — session / auth
  0x0100: { name: BUSY,                 note: "client limit reached; carries retry_after_ms" }
  0x0101: { name: UNAUTHORIZED,         note: "token invalid/revoked" }
  0x0102: { name: NOT_CONTROLLER,       note: "control op without controller role" }
  0x0103: { name: PAIRING_REQUIRED,     note: "controller requested, no token, pairing window closed" }
  0x0104: { name: PAIRING_DENIED,       note: "bad pin_proof or pairing window closed" }
  0x0105: { name: SESSION_EVICTED,      note: "slow-consumer or admin kick (GOODBYE code)" }
  0x0106: { name: DUPLICATE_INSTANCE,   note: "instance_id already in live session; old session evicted instead — see §6.8" }
  0x0107: { name: NORMAL_CLOSURE,       note: "clean voluntary teardown (GOODBYE code, either direction) — not an error" }
  0x0108: { name: DEADMAN_TIMEOUT,      note: "hub-initiated session teardown: silence exceeded the deadman window (§11.3, GOODBYE code)" }
  0x0109: { name: REBOOTING,            note: "hub is committing a change by rebooting and is closing every session first (RFC-020/022.2, GOODBYE code). Preceded by an ECHO carrying reboot_in_ms; on return the changed boot_id tells clients what happened." }
  0x010A: { name: READY_TIMEOUT,        note: "session never sent CATALOG_READY within catalog_ready_timeout_ms (RFC-015, GOODBYE code). Needed because liveness reaping NEVER fires on a client that PINGs happily but never finishes adopting the catalog — it would hold a slot forever with both planes gated shut." }
  0x010B: { name: NOT_READY,            note: "frame refused because the session has not sent CATALOG_READY yet (RFC-015). READY gates BOTH planes: pre-READY INTENTs are NACK'd, not queued, because a client acting before it has adopted the retained safety latch breaks §11.5(2)." }
  0x010C: { name: IDLE_REAPED,          note: "RFC-039.4: hub-initiated teardown of a NON-OWNING session that fell silent past idle_reap_multiplier x ping_interval_idle_ms (RFC-024, GOODBYE code). Distinct from DEADMAN_TIMEOUT on purpose: reaping a dark viewer is housekeeping with zero motion consequence, and before this code existed it was reported with the motion-safety code — a reaped dashboard read as a deadman event in every log and client. RFC-042: silence no longer reaches this code directly — it marks a session STALE instead (session_event_kinds.4) — so the reference hub no longer emits DEADMAN_TIMEOUT or IDLE_REAPED for silence; both stay registered for a hub/policy combination that still wants to terminate outright." }
  0x010D: { name: SLOT_RECLAIMED,       note: "RFC-042: a HELLO that would otherwise NACK BUSY instead evicted a STALE session to make room (lowest access tier first, tie-break longest continuously stale) — best-effort GOODBYE code, since the reclaimed session was stale for a reason and may never receive it. Distinguishable from SESSION_EVICTED (admin/slow-consumer) and from DEADMAN_TIMEOUT/IDLE_REAPED (which no longer fire for silence at all)." }
  # 0x02xx — subscription / QoS
  0x0200: { name: UNKNOWN_CHANNEL,      note: "channel id not in catalog" }
  0x0201: { name: ACCESS_DENIED,        note: "channel access level above session role" }
  0x0202: { name: CLASS_MISMATCH,       note: "e.g. SUBSCRIBE to an INTENT channel" }
  0x0203: { name: SUB_LIMIT,            note: "per-session subscription cap reached" }
  0x0204: { name: SUBSCRIBE_REJECTED,   note: "RFC-033.2: the SUBSCRIBE frame as a WHOLE could not be processed (undecodable, or more wishes than max_subscriptions_per_frame) — as opposed to the per-channel codes above, which reject one wish and grant the rest. `detail` carries the reason. Exists because the alternative was observed silence: a dropped SUBSCRIBE leaves a healthy-looking LIVE session with zero STATE, which presents as a client rendering bug and cost two debugging nights." }
  # 0x03xx — intent
  0x0300: { name: CONFLICT,             note: "precondition (cfg_gen CAS) failed" }
  0x0301: { name: RATE_LIMITED,         note: "ingress intent rate exceeded" }
  0x0302: { name: INVALID_VALUE,        note: "outside schema min/max or wrong type; also a store import whose kind or size the hub refuses (RFC-021.5)" }
  0x0303: { name: UNSUPPORTED_OP,       note: "intent op not implemented on this hub" }
  # 0x04xx — safety refusals (UIs SHOULD render these distinctly)
  0x0400: { name: ESTOP_ACTIVE,         note: "refused while e-stop latched" }
  0x0401: { name: NOT_HOMED,            note: "motion intent before homing" }
  0x0402: { name: INTERLOCK,            note: "hub-specific safety interlock" }
  0x0403: { name: SOURCE_CONFLICT,      note: "another session owns this arbiter source" }
  0x0404: { name: TAKEOVER_REQUIRED,    note: "control exists; retry with takeover flag" }
  0x0405: { name: CLEAR_REFUSED,        note: "e-stop clear conditions not met (§11.2)" }
  # 0x05xx — transfer
  0x0500: { name: CHUNK_UNAVAILABLE,    note: "blob chunk index out of range, or a store/slot that does not exist WITHIN a registered namespace (generalized from 'catalog chunk' by RFC-021 — the catalog is now namespace 0). An unregistered NAMESPACE itself is the more specific INVALID_NAMESPACE (0x0504, RFC-049e) — this code no longer covers that case." }
  0x0501: { name: REASSEMBLY_TIMEOUT,   note: "fragment reassembly abandoned (5 s)" }
  0x0502: { name: ETAG_MISMATCH,        note: "static-profile client etag != hub catalog etag" }
  0x0503: { name: BLOB_REFUSED,         note: "RFC-039.2: a RECEIVER refusing a declared blob (total_bytes over its reassembly budget), sent as a GOODBYE code by the client rather than idling in a half-session. The observed failure: a client's DoS-guard cap silently refused a grown catalog's transfer header and the session went LIVE WITH NO CATALOG — no error anywhere, every STATE frame undecodable, READY_TIMEOUT eventually killing it 15 s later and blaming the client. Refusal is legal; SILENT refusal is not." }
  0x0504: { name: INVALID_NAMESPACE,    note: "RFC-049e: a BLOB_REQ naming a `blob.ns` value not in the registered `blob_namespaces` table (0 catalog / 1 store; 128-255 device-defined are legal too — only a value truly outside every registered/device range trips this). Split out of CHUNK_UNAVAILABLE so a client can tell 'namespace does not exist' from 'namespace exists, item does not' (§18-8's panel-flagged gap) instead of receiving the same code for both. Same range as its siblings because it is a transfer-request refusal, not a new error class. Implementation: Phase D." }

# ---------------------------------------------------------------------------
# Packed payload field types (catalog schema `type` for STREAM/STATE layouts).
#
# Types 8–10 are RFC-026's string tier 2: FIXED-WIDTH, ZERO-PADDED UTF-8,
# register-map style. Fixed width is the whole point — packed layouts ban
# variable-length fields because every field's offset must be static and
# evolution must stay append-only. A shorter string is NUL-padded to width; a
# reader stops at the first NUL or the width, whichever comes first.
#
#   * STREAM sample layouts stay STRING-FREE. The motion hot path never pays
#     for text (RFC-026 tier 3).
#   * A `secret`-flagged string SHOULD be str16, or write-only with a presence
#     bit: a `secret str32` burns 13% of a 242 B snapshot to communicate one
#     bit of "is it set" (the value itself never appears in STATE — RFC-009.5).
# ---------------------------------------------------------------------------
packed_field_types:
  0:  { name: u8 }
  1:  { name: i8 }
  2:  { name: u16 }
  3:  { name: i16 }
  4:  { name: u32 }
  5:  { name: i32 }
  6:  { name: f32 }
  7:  { name: bitfield8, note: "bit meanings enumerated in catalog entry" }
  8:  { name: str16, note: "16 bytes, zero-padded UTF-8 (RFC-026). The default string width — session-roster names, device names, secret settings." }
  9:  { name: str32, note: "32 bytes, zero-padded UTF-8 (RFC-026)" }
  10: { name: str64, note: "64 bytes, zero-padded UTF-8 (RFC-026). 26% of a 242 B snapshot — use deliberately." }

# ---------------------------------------------------------------------------
# TOMBSTONE (Phase C2 catalog evolution): `setting_categories` (the four-value
# device/user/limits/tuning/diagnostics vocabulary) is RETIRED. Every catalog
# entry's `category` (channel-entry key 10) now carries a `ui_categories` id
# instead — see that section below, and RENDERING.md §3. This is a pre-tag
# restructuring (registry header above: permitted before the v1.0 tag), not an
# append — the wire KEY (10/11) is unchanged, only the value vocabulary it
# carries. No consumer reads `setting_categories` after this pass; the name is
# retired rather than renumbered.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Setting flags (bit values) — catalog field annotation `flags` (RFC-009.1).
# ---------------------------------------------------------------------------
setting_flags:
  bit0: { name: advanced,         note: "hide behind an 'advanced' affordance by default; NEVER remove from the surface" }
  bit1: { name: restart_required, note: "the applied value takes effect on the next boot (distinct from RFC-020's reboot_in_ms, which is the hub rebooting ITSELF to commit)" }
  bit2: { name: secret,           note: "NORMATIVE (RFC-009.5): the value NEVER appears in STATE. The snapshot carries only a set/unset presence bit. Writes ride the paired INTENT normally and ECHO confirms application WITHOUT echoing the value. A WiFi password must never ride a retained snapshot that open-access `watch` sessions receive." }

# ---------------------------------------------------------------------------
# Field roles — the semantic vocabulary for catalog field annotation `role`
# (RFC-006(b) mechanism, adopted by RFC-009.1 and RFC-019).
#
# WIRE ENCODING: `role` is a TSTR (<= 24 B), not a number. It has to be:
# RFC-019's action roles carry a device-chosen suffix (`action.reset_stats`),
# which no integer enum can express. The names below are the SPEC-REGISTERED
# vocabulary; the dotted namespace is open, and unregistered roles are legal.
#
# DOCTRINE (binding, RFC-009): nothing is hardcoded as a REQUIREMENT; roles
# are hardcoded as OPPORTUNITIES. A client that recognizes a registered role
# MAY upgrade to a bespoke widget (a position scope, a dual-limit editor); a
# client that does not MUST fall back to generic rendering by type +
# constraints. Fallback is mandatory, upgrades are optional. An unknown role
# is never an error.
#
# FRAMING (RFC-006 as corrected by RFC-008): limits discovery exists for
# DISPLAY and OPTIONAL pre-adaptation. A client MUST NOT be required to reason
# about feasibility to produce good motion — the hub owns that. Normative
# language around these is MAY, never SHOULD.
#
# CONVENTIONS, not entries:
#   * `<role>.peak` — the peak/hold companion of any telemetry role
#     (`telemetry.current` + `telemetry.current.peak`). A client MAY render
#     the pair as one tile; a client that doesn't shows two honest fields.
#   * `action.<name>` — RFC-019. Marks an INTENT schema field as an ACTION
#     (a verb) rather than a value: `action.reset_stats`, `action.home`,
#     `action.ap_reset`. ECHO echoes the op. Reset classification (RFC-019/011):
#     an action that restores CONFIGURATION bumps cfg_gen AND reset_gen; an
#     action that only clears COUNTERS bumps reset_gen alone.
# ---------------------------------------------------------------------------
field_roles:
  "limit.user.speed":    { note: "speed ceiling of the USER (manual) limit set. CEILING, never a target." }
  "limit.user.accel":    { note: "accel ceiling of the user limit set" }
  "limit.input.speed":   { note: "speed ceiling of the INPUT (machine-driven: patterns, streams, TCode) limit set" }
  "limit.input.accel":   { note: "accel ceiling of the input limit set" }
  "limit.input.jerk":    { note: "jerk ceiling of the input limit set" }
  "geometry.max_travel":      { note: "the configured travel ceiling — how far the machine's rail geometry allows it to search/move (0x0081 max_rail is the worked example: also the sensorless-homing search sweep bound). Distinct from window.min/max, which is the operator-chosen SUB-range within this travel." }
  "geometry.measured_travel": { note: "the usable travel a real home actually measured between the two hard stops, as opposed to geometry.max_travel's configured ceiling. Zero/absent-of-meaning until the first successful home this session; a client MUST NOT treat zero as a real measurement." }
  "window.min":          { note: "stroke window lower bound. Limits normalized against the window are window-relative and therefore MOVE when it does — which is exactly why this is a STATE field and not a one-shot WELCOME value." }
  "window.max":          { note: "stroke window upper bound" }
  "telemetry.position":  { note: "live actuator position" }
  "telemetry.target":    { note: "RFC-032: the position the machine is currently COMMANDED to, as opposed to telemetry.position which is where it measurably is. Lag is deliberately NOT a role: it is target - position, computed client-side — registering a third field for a subtraction would invite two sources of truth for one number." }
  "telemetry.velocity":  { note: "live actuator velocity" }
  "telemetry.current":   { note: "motor/drive current" }
  "telemetry.power.bus": { note: "DC bus voltage or power" }
  "telemetry.temp":      { note: "a temperature reading; the field's own name/unit says which" }
  "telemetry.uptime":    { note: "hub uptime" }
  "identity.name":       { note: "the writable machine-name setting (RFC-026 tier 2, str16/str32). Its READ-ONLY twin is WELCOME identity.hub_name." }
  "meta.enabled_mask":   { note: "RFC-009.4: a bitfield8 field whose bit i gates the i-th setting-annotated field of the SAME layout. On-change, retained, conflated — every client grays from one ground truth. Disabled means GRAY, never hide." }
  "meta.reset_gen":      { note: "RFC-019: increments on every applied reset in this counter group, so ALL subscribers observe the reset, not just the sender who asked for it." }
  "pattern.running":     { note: "whether the built-in pattern generator is currently driving the machine" }
  "pattern.select":      { note: "which built-in pattern the generator plays; options are the device's pattern names, index-aligned with the wire value" }
  "pattern.speed":       { note: "pattern generator speed knob, as a percentage of its own range" }
  "pattern.depth":       { note: "pattern generator depth knob: how far into the stroke window it reaches" }
  "pattern.stroke":      { note: "pattern generator stroke-length knob, as a percentage of the available depth" }
  "pattern.sensation":   { note: "pattern generator character knob; what it changes depends on the selected pattern" }
  # ---- command.* (RFC-032): value-bearing COMMANDS. action.<name> marks VERBS
  # (render a button); command.<quantity> marks an INTENT field whose VALUE is
  # the setpoint (render a positional/numeric control). Tagging 0x0100 move's
  # `position` as action.move would have told every generic client to draw a
  # button where a slider belongs — the device catalog refused, correctly, and
  # the result was that the most-used control on the machine was reachable only
  # by a client hardcoding the channel id. A command role generally has a
  # telemetry.* counterpart to pair with (command.position <-> telemetry.target).
  "command.position":    { note: "RFC-032: INTENT field carrying a commanded ABSOLUTE target position in the channel's own unit. A client that finds it MAY render a positional control (rail, tape, slider) and send the value on that field's channel." }
  # ---- plan.* (RFC-035): motion-plan telemetry — the segment in flight.
  # Inclusion test: "would a DIFFERENT machine's motion planner have this
  # concept?" — the same test that kept Advanced-pattern internals out of
  # pattern.*. Before these, the reference client located the plan channel by
  # regex over the entry NAME (/plan/i), which silently fails on any machine
  # that names the concept differently.
  "plan.start":          { note: "normalized start position of the segment in flight" }
  "plan.end":            { note: "normalized end position of the segment in flight" }
  "plan.current":        { note: "normalized current position along the plan" }
  "plan.velocity":       { note: "current planned velocity" }
  "plan.elapsed":        { note: "elapsed time within the segment in flight" }
  "plan.duration":       { note: "total duration of the segment in flight" }
  "plan.style":          { note: "which planning style produced the segment; options are the device's style names, index-aligned with the wire value" }
  # ---- source.* (RFC-048): promotes RFC-045's `on_disconnect` setting from
  # ordinary settings-metamodel data to a formally registered role, GENERALIZED
  # to any autonomous source (a pattern generator today; future on-hub script
  # or scene playback), not only PatternEngine. This is the whole point of
  # registering it: a generic client can now find this control on ANY hub's
  # catalog without hardcoding that hub's channel, the same upgrade `command.*`
  # and `plan.*` already got. The field itself is still device-declared,
  # rendered through the ordinary settings metamodel (SPEC §8.8) — only the
  # ROLE is now registry-formal. See RENDERING.md §10.1 for its rendering rules
  # (safety-relevant: co-located with the run control, confirm-gated to enable,
  # distinct unattended-and-moving indicator). Streaming sources are explicitly
  # OUT of scope: a dead stream leaves the machine still by construction
  # (SETTLE, SPEC §11.3), so no switch exists or is wanted for them.
  "source.background_run": { note: "bool, `setting_key`-annotated: whether THIS autonomous source keeps running when its owning session ends. false (DEFAULT) = the source stops when its controlling session ends. true = the source deliberately continues in the background, reachable only by the role-exempt stop/estop ops (§11.2) from any session. Applies to any hub-autonomous source, never to a command-driven one." }

# ---------------------------------------------------------------------------
# Curve families (u8) — the `curve_family` (cbor key 45) wish/echo value on a
# segment-class publish (RFC-030).
#
# {target, duration_ms, end_vel} uniquely determines a cubic Hermite, so a
# segment stream is a COMPLETE encoding of the sender's curve — but only if
# both ends agree on the curve FAMILY. A C2 quintic CANNOT reproduce a C1
# cubic across a knot: the script's acceleration genuinely STEPS there, and
# the device's backward-difference `af` estimate is estimating a quantity
# that is two-valued at the knot. Measured: forcing C1 gives 3-6x lower
# in-span jerk than the quintic reconstruction of the same C1 script.
#
# Deliberately NOT a taxonomy of interpolator algorithms: the wire needs the
# SMOOTHNESS CLASS the reconstruction must honor, not the vendor's name.
# Pchip and Makima are both c1_cubic and that is the correct answer.
#
# The machine override outranks the declaration (`curve_policy`: follow
# client / force C1 / force C2) — a feel and safety decision belonging to
# whoever is strapped to the machine. NO CLAMPING SEMANTICS ARE IMPLIED
# (operator ruling, RFC-030.5). The GRANT echo carries the EFFECTIVE family
# post-override, so a client can tell "honored" from "downgraded".
# ---------------------------------------------------------------------------
curve_families:
  0: { name: unspecified, note: "the compatible default — the hub behaves exactly as it did before RFC-030. What every pre-RFC-030 client is." }
  1: { name: c1_cubic,    note: "velocity-continuous cubic (Linear/Pchip/Makima/monotone-cubic senders). Acceleration lawfully STEPS at knots; a follow-client hub reconstructs C1 and does NOT smooth the corner the author put there." }
  2: { name: c2_quintic,  note: "curvature-continuous; the sender means the smoothness. A follow-client hub may use its C2 reconstruction (backward-difference af estimation is valid here — the quantity exists)." }
  3: { name: step,        status: reserved, note: "held value with instantaneous transitions (step/none interpolation). The family says intent, the machine owns feasibility as always. RFC-049a: NUMBER KEPT, never renumbered, but status is `reserved` — the reference engine has no step renderer, so a `step` declaration renders as `c2_quintic` and the GRANT echo reports exactly that effective family (§9.6, §18-20). Declarable again when a step renderer exists in the reference engine; only the delegate's mapping changes when it does." }

# ---------------------------------------------------------------------------
# Pairing modes (bit values) — advertised as a BITMASK in WELCOME
# `trust`.pairing_modes; the roster records a device's mode as the single set
# bit it used (RFC-027.2). All three end in PAIR_GRANT {token, role}: ROLE IS
# AN ATTRIBUTE OF THE GRANT, NEVER OF THE CEREMONY. There is zero-or-one PIN
# on a hub, never per-tier secrets.
# ---------------------------------------------------------------------------
pairing_modes:
  bit0: { name: knock_approve, note: "PRIMARY and capability-agnostic: bare PAIR_REQ with no proof -> bounded pending list (pairing_pending_max) exposed as protocol state (0x000A/0x000B) -> ANY `configure` session approves {instance_id, role}. The joiner needs one button and no display; the trusted surface is any configure client, which kills the circular 'the WebUI is trusted because it's the WebUI' dependency. RECOMMENDED partly because its approval surface shows the knocker's identity on hardware the attacker does not control." }
  bit1: { name: pin_proof,     note: "the HMAC-PIN flow, for keyboard-bearing joiners when no configure session exists. HONESTY CLAUSE (normative): 4 digits = 10^4 offline HMACs, so a passive observer of the exchange can brute-force it. Acceptable for the v1 threat model (casual/drive-by prevention) and MUST be stated plainly. SPAKE2 is the reserved v2 upgrade — not v1, because WebCrypto has no PAKE and mandating it would exile the browser client." }
  bit2: { name: push_to_pair,  note: "PHYSICAL-PRESENCE proof opens a short SINGLE-GRANT window. The spec requires the PROOF, not a GPIO — minimum hardware is NONE, because the power cord is the button: factory-fresh (zero configure tokens) boots claimable and the first knock gets `configure` (possession is root); later, N=3 consecutive boots with uptime <10 s opens the window (NVS counter only; cannot collide with a session, since any power loss already stops motion and forces re-home). A hub with a real button MAY bind it — UX upgrade, never required. FACTORY RESET MUST BE A HARDER GESTURE than opening pairing." }

# ---------------------------------------------------------------------------
# Procedure phases (u8) — the `phase` field of an RFC-020 procedure STATE
# channel. One such channel per CONCURRENTLY-RUNNABLE procedure (full-snapshot
# semantics can represent exactly one).
#
# RFC-020 does NOT fix a phase vocabulary and procedure channels are
# device-authored, so only the LIFECYCLE phases — the ones any generic client
# must be able to render without knowing the procedure — are registered here.
# Intermediate steps ("writing register 3 of 3") are device-defined at 128+
# and carry their own labels. Same two-tier shape as setting_categories.
# ---------------------------------------------------------------------------
procedure_phases:
  0: { name: idle,      note: "not running; the reconnect-safe resting value" }
  1: { name: running,   note: "started and in progress; `progress` 0–100 is advisory" }
  2: { name: succeeded, note: "terminal, ok. Also EVENTed (RFC-020)." }
  3: { name: failed,    note: "terminal, error — `result` u16 carries a nack_codes value or a device code" }
  4: { name: aborted,   note: "terminal, canceled or superseded" }
# 5–127 reserved for spec. 128–255 device-defined intermediate steps (labeled
# by the device; a client that does not recognize one renders it as 'running').

# ---------------------------------------------------------------------------
# BLE GATT identity (RFC-046 §1-2) — ONE ecosystem-wide service + write(c2h) +
# notify(h2c) characteristic UUID set. Every conformant BLE hub advertises the
# SAME service UUID; every client scans for exactly one thing, the way the
# 0x17 BEACON frame already does for the ESP-NOW peer radio (§13.7) — this is
# the phone-facing twin.
#
# The first three groups spell the project name in ASCII, deliberately, so
# the UUID is greppable and mnemonic rather than an opaque v4: 534C4F50 =
# 'SLOP', 5359 = 'SY', 4E43 = 'NC'. The last two groups are a characteristic
# discriminator matching the protocol's own c2h/h2c framing (§13.1): ...0002
# is the WRITE characteristic (client -> hub), ...0003 is the NOTIFY
# characteristic (hub -> client). ...0001 is the service itself.
# ---------------------------------------------------------------------------
ble_identity:
  service_uuid:     "534C4F50-5359-4E43-8000-000000000001"
  write_char_uuid:  "534C4F50-5359-4E43-8000-000000000002"   # c2h (write) — client submits frames here
  notify_char_uuid: "534C4F50-5359-4E43-8000-000000000003"   # h2c (notify) — hub delivers frames here

# ---------------------------------------------------------------------------
# BLE advertising flags (u8) — RFC-046 §2. The one flags byte a legacy
# (≤31 B) advertising payload can spare after the service UUID and a
# shortened hub name; the fuller name rides the scan response. Bits not
# listed MUST be zero.
# ---------------------------------------------------------------------------
ble_adv_flags:
  bit0: { name: pairing_window_open, note: "a §12.3 association window is open right now (same meaning as the 0x17 BEACON pairing-open flag, ESP-NOW's equivalent)" }
  bit1: { name: ws_available,        note: "the hub currently has a live IP and a listening WebSocket port — RFC-043's signal that a BLE-connected client SHOULD auto-upgrade to WS. The endpoint itself rides WELCOME `ws_port`/`ipv4` (cbor_keys 46/47), not this byte — a single bit cannot carry a port and an address, and the upgrade hop happens post-HELLO anyway." }
  # bits 2-7 reserved, zero

# ---------------------------------------------------------------------------
# UDP discovery (RFC-046 §5) — a minimal broadcast probe/reply pair, the
# canonical WS-side discovery path for LAN clients without BLE (desktop
# shells, MFP, Intiface): plain sockets both ends, immune to the
# multicast/mesh-AP/Android failure modes that make mDNS unreliable in real
# homes. Frame ids DISCOVER_PROBE (0x1E) / DISCOVER_REPLY (0x1F) are
# allocated in `frame_types`, which also carries the payload shape. This
# section is the port/magic identity a socket-level implementation binds to
# before it ever sees a frame. Read-only identity, no control surface: a
# probe cannot command anything, and a reply carries nothing a passive
# observer of WELCOME could not already learn.
# ---------------------------------------------------------------------------
udp_discovery:
  port: 21328           # 0x5350 — ASCII 'SP' (SlopSync Probe), same naming convention as the BLE UUID's ASCII grouping
  magic: "SLOP"         # 0x53 0x4C 0x4F 0x50, matching the ESTOP frame's own magic-byte convention (§5.5)
  reply_rate_limit_per_source_s: 1   # hub replies at most once per second per source address, so a probe storm cannot load the hub

# =============================================================================
# RFC-048 — the UI/rendering constitution. Normative prose, tables, recipes
# and rules live in RENDERING.md; this file holds only the NUMBERS, exactly
# as it does for the wire protocol. Every vocabulary below is FROZEN at the
# v1.0 tag (RENDERING.md §14, the Vocabulary Completeness Doctrine) — additions
# are a new RFC, never a silent extension. None of these fields are wired onto
# real catalog entries in this landing (spec/registry text only); wiring them
# is next-phase work, named so it is never mistaken for done. See RENDERING.md
# for the normative prose this data supports.
# =============================================================================

# ---------------------------------------------------------------------------
# `category` (u8) — WHERE a catalog entry lives (RENDERING.md §3). Ids 1-14
# are the frozen, complete spec set, in canonical menu order. 0x40-0x7E is the
# vendor/device range (a hub declaring one MUST supply a label, mirroring
# `setting_categories`' device-defined tail). Graceful-extension rule
# (normative, RENDERING.md §3): a client MUST render ANY unrecognized category
# id — including a vendor id it has not been taught — under `other` (14),
# using the catalog-provided label, never dropped. This is the structural
# valve that makes freezing the fourteen safe.
# ---------------------------------------------------------------------------
ui_categories:
  1:  { name: control,    note: "driving the machine now: move, pattern run/speed/depth, streams" }
  2:  { name: motion,     note: "live physical telemetry" }
  3:  { name: safety,     note: "faults, interlocks, e-stop state — the stop affordance itself is rank-pinned (ui_ranks), not a menu item here" }
  4:  { name: limits,     note: "window + ceilings" }
  5:  { name: library,    note: "stored content: presets, patterns, scripts, positions, profiles" }
  6:  { name: playback,   note: "hub-local content transport: play/pause/seek/queue" }
  7:  { name: auxiliary,  note: "secondary actuators: heat, lube, suction, inflation" }
  8:  { name: automation, note: "routines, schedules, scenes" }
  9:  { name: tuning,     note: "engine internals, calibration" }
  10: { name: hardware,   note: "geometry, drive config, sensors, homing" }
  11: { name: network,    note: "WiFi/BLE state, endpoints, provisioning" }
  12: { name: session,    note: "clients, roles, ownership, pairing/trust" }
  13: { name: system,     note: "power, thermals, memory, firmware, logs" }
  14: { name: other,      note: "the defined overflow — every unrecognized category id (including an untaught vendor id) renders here, per the graceful-extension rule" }
# 15-0x3F reserved for future spec-registered categories. 0x40-0x7E vendor/
# device range (MUST carry a label). 0x7F+ reserved.

# ---------------------------------------------------------------------------
# `rank` (u8) — HOW MUCH a catalog entry/field matters by default
# (RENDERING.md §4). The existing `setting_flags.advanced` bit folds into this
# ladder as its migration. Frozen at six. Unknown rank, or no rank annotation
# at all, renders as `detail`.
# ---------------------------------------------------------------------------
ui_ranks:
  0: { name: hero,       note: "the machine's face; surfaced by default on every renderer class" }
  1: { name: control,    note: "everyday driving controls; surfaced by default on handheld/full, one navigation step away on glance" }
  2: { name: detail,     note: "useful but not primary; reachable, not surfaced" }
  3: { name: advanced,   note: "the `setting_flags.advanced` bit's migration into this ladder; hidden behind an advanced affordance by default, NEVER removed from the surface" }
  4: { name: diagnostic, note: "reachable on every class; a renderer MAY choose to omit it under its own display budget, but that is the renderer's choice, not this rank's" }
  5: { name: hidden,     note: "carried on the wire for compatibility, NEVER rendered — the honest home for an inert-but-released field" }

# ---------------------------------------------------------------------------
# Value axes (RENDERING.md §5) — three small orthogonal vocabularies tagging
# WHAT STATISTIC a field is. Default when absent: aspect=live, scope=session,
# provenance=actual. Companion composition, reset linkage and the honesty
# rule (never present a live value as a peak or vice versa; scope always
# displayed or unambiguously implied) are RENDERING.md §5.4, normative.
# ---------------------------------------------------------------------------
value_aspects:
  0: { name: live,  note: "the value now (default)" }
  1: { name: peak,  note: "highest observed" }
  2: { name: min,   note: "lowest observed" }
  3: { name: mean,  note: "average observed" }
  4: { name: total, note: "cumulative (an odometer figure)" }
  5: { name: rate,  note: "a derivative/frequency quantity" }

value_scopes:
  0: { name: session,  note: "since this client connected (default)" }
  1: { name: lifetime, note: "since the device was manufactured/last factory-reset" }
  2: { name: window,   note: "a bounded rolling window, device-defined width" }

value_provenance:
  0: { name: demand,  note: "the raw requested value" }
  1: { name: planned, note: "the target the planner is currently aiming for" }
  2: { name: actual,  note: "the measured value (default). demand/planned/actual are one quantity at three stages; the axis archetype's commanded-vs-actual overlay is their companion composition." }

# ---------------------------------------------------------------------------
# `unit` (u8) — a FROZEN NUMERIC companion to the existing free-string `unit`
# field (§8.2). Both exist; wiring this table onto real catalog fields is
# next-phase work. Deliberately over-provisioned for foreseeable actuators
# (RENDERING.md §6). Unknown unit id -> render the catalog's label string
# verbatim.
# ---------------------------------------------------------------------------
unit_ids:
  0:  { name: mm,      note: "length" }
  1:  { name: mm_s,    note: "speed (mm/s)" }
  2:  { name: mm_s2,   note: "acceleration (mm/s²)" }
  3:  { name: mm_s3,   note: "jerk (mm/s³)" }
  4:  { name: normalized, note: "0-1" }
  5:  { name: percent, note: "%" }
  6:  { name: hz,      note: "Hz" }
  7:  { name: ms,      note: "milliseconds" }
  8:  { name: s,       note: "seconds" }
  9:  { name: v,       note: "volts" }
  10: { name: a,       note: "amps" }
  11: { name: w,       note: "watts" }
  12: { name: wh,      note: "watt-hours" }
  13: { name: deg_c,   note: "°C" }
  14: { name: count,   note: "dimensionless count" }
  15: { name: bytes,   note: "data size" }
  16: { name: db,      note: "decibels" }
  17: { name: n,       note: "force — over-provisioned: force-feedback actuators" }
  18: { name: kpa,     note: "pressure — over-provisioned: suction/inflation" }
  19: { name: ml,      note: "volume — over-provisioned: lube dosing" }
  20: { name: ml_min,  note: "flow rate — over-provisioned: lube dosing" }
  21: { name: rpm,     note: "rotational speed — over-provisioned: rotary actuators" }
  22: { name: bpm,     note: "beats per minute — over-provisioned: bio-sync accessories" }

# ---------------------------------------------------------------------------
# Action tags (tstr) — the specific `action.<name>` suffixes (§8.8 convention)
# a conformant client MAY special-case to upgrade a generic `trigger`
# (ui_archetypes) into a purpose-specific rendering. An unregistered
# action.<name> suffix remains legal (nothing here is a requirement on the
# device); unknown tag -> generic trigger/control per the derivation table
# (RENDERING.md §7/§8.2). Frozen, thirteen, v1.0.
# ---------------------------------------------------------------------------
action_tags:
  move:          { note: "the primary positional command — usually already the axis archetype's own binding, rarely a separate trigger" }
  safety:        { note: "a safety-adjacent action outside the law-bound stop archetype itself (e.g. an override/bypass toggle's companion action)" }
  home:          { note: "a homing-cycle trigger" }
  calibrate:     { note: "a calibration-cycle trigger; commonly the entry point to a `wizard` widget pattern" }
  reset:         { note: "aspect-group reset linkage (value_aspects/RENDERING.md §5.4); co-located with the group it resets, confirm-gated" }
  save:          { note: "persist current state (settings, not a preset item)" }
  persist:       { note: "commit a value past a reboot — distinct from `setting_flags.restart_required`, which is about WHEN a change takes effect, not whether it survives one" }
  pair:          { note: "enters a pairing ceremony affordance" }
  identify:      { note: "blink-to-find — every device ecosystem needs one" }
  admin:         { note: "a generic administrative action not covered by a more specific tag" }
  reboot:        { note: "firmware reboot; SHOULD always confirm (cbor_keys.reboot_in_ms)" }
  preset_save:   { note: "save-to-store, part of the generator-advanced preset roster" }
  preset_recall: { note: "load-from-store, same roster" }

# ---------------------------------------------------------------------------
# Archetypes (u8) — the control style + interaction contract a catalog field
# or channel renders with (RENDERING.md §8). DERIVED by a normative decision
# table in the common case (never carried on the wire); an optional explicit
# `archetype` hint overrides. `fallback` is the MANDATORY composition-of-
# frozen-primitives every archetype declares (the firmware-immortality rule,
# RENDERING.md §14d) — a primitive lists itself; a composite lists the
# primitives it degrades to on a client that has not been taught it. Frozen
# at fifteen, v1.0.
# ---------------------------------------------------------------------------
ui_archetypes:
  0:  { name: readout,   note: "display of a value; bounds present -> bar/gauge projection",                 fallback: [readout] }
  1:  { name: indicator, note: "status lamp; never the sole carrier of a safety fact",                        fallback: [indicator] }
  2:  { name: slider,    note: "bounded numeric intent; commit-on-release",                                   fallback: [slider] }
  3:  { name: stepper,   note: "precision numeric, increments in `step`-sized ticks",                         fallback: [stepper] }
  4:  { name: toggle,    note: "boolean",                                                                     fallback: [toggle] }
  5:  { name: select,    note: "enum + options; wire value is the array index",                               fallback: [select] }
  6:  { name: trigger,   note: "payload-less intent (button); destructive flag -> mandatory confirm on every class", fallback: [trigger] }
  7:  { name: axis,      note: "1-D positional hero control (role command.position) with commanded-vs-actual overlay", fallback: [axis] }
  8:  { name: chart,     note: "time-series; glance degrades to sparkline/value; missing samples render as gaps",     fallback: [chart] }
  9:  { name: list,      note: "roster/store items + item actions; pending is a THIRD state distinct from success/failure", fallback: [list] }
  10: { name: text,      note: "constrained string; glance projects a digit/char wheel — the pairing-PIN path",       fallback: [text] }
  11: { name: stop,      note: "the safety stop affordance — bound BY LAW to safety-op identity, never derived from annotation; reachable at every rank on every class, never role-gated, never hidden", fallback: [stop] }
  12: { name: pad2d,     note: "two-axis control — the multi-axis runway",                                     fallback: [slider, slider] }
  13: { name: color,     note: "chromatic actuator setpoint (lighting/glow accessories)",                      fallback: [slider, slider, slider] }
  14: { name: datetime,  note: "moment/interval input (automation schedules)",                                 fallback: [text] }

# ---------------------------------------------------------------------------
# Regions (u8) — four abstract placement zones + one modal layer
# (RENDERING.md §9). Geometry/position/size/style within a region are the
# renderer author's craft; WHAT lives in each region is normative. Frozen
# at five.
# ---------------------------------------------------------------------------
ui_regions:
  0: { name: primary,    note: "hero-rank patterns (axis-hero and peers); the machine's face, exactly one per axis/capability instance" }
  1: { name: persistent, note: "the safety-strip: latch state, ownership, the stop archetype. MUST remain visible in every navigation state of every class" }
  2: { name: content,    note: "the category tree's territory: cards/panes/menu screens in canonical category order; diagnostic-rank material last or collapsed by default" }
  3: { name: utility,    note: "connection/session status, identity, theme — chrome about the CLIENT, kept out of the machine's way" }
  4: { name: overlay,    note: "the modal layer: confirms, pairing knocks, alerts. Only ceremony/confirmation content may use it; nothing persistent lives here" }

# ---------------------------------------------------------------------------
# Renderer classes (u8) — all classes render ONE category tree; they differ
# in projection and default surfacing, never in reachable content
# (RENDERING.md §12). A device between budgets adopts the nearer class.
# Frozen at three.
# ---------------------------------------------------------------------------
renderer_classes:
  0: { name: glance,   note: "OLED remote — home screen = hero-rank; categories = a menu stack; everything except diagnostic reachable by navigation; stop affordance reachable from every screen" }
  1: { name: handheld, note: "phone — categories as sections/tabs; hero+control surfaced, detail one tap away" }
  2: { name: full,     note: "desktop — categories as panes, everything visible" }

# ---------------------------------------------------------------------------
# Widget patterns (u8) — proven compositions extracted from the reference
# client (RENDERING.md §10): archetype composition + region + states +
# per-class projection. `required: true` marks a pattern a handheld/full
# client MUST provide when its capability is present (glance-class: reachable
# via the category tree instead). Frozen at thirteen, three required.
# ---------------------------------------------------------------------------
widget_patterns:
  0:  { name: axis-hero,         note: "rail + window band + command tape + live position/velocity numerals + nested plan-view; command-tape domain is the REPORTED window", required: true }
  1:  { name: plan-view,         note: "in-flight plan lane; visibility gated by data freshness, collapses to zero height when idle" }
  2:  { name: link-strip,        note: "utility region: connection phase, rx liveness, catalog state; safety-relevant chips pinned, rest may scroll" }
  3:  { name: safety-strip,      note: "persistent region; ops sorted role-EXEMPT-first; stop sticky-visible within any overflow" }
  4:  { name: settings-card,     note: "a subgroup's fields via the archetype decision table; every disabled control shows WHICH gate disabled it" }
  5:  { name: scope,             note: "multi-lane strip chart: missing samples render as GAPS never zeros; series colors stable by declaration order across reconnects" }
  6:  { name: event-stream,      note: "bounded rings; unknown body fields render generically as key=value, never dropped; auto-scroll with user-scroll override" }
  7:  { name: roster,            note: "list + item actions; pending is a THIRD state distinct from success/failure; locked-by-role honestly distinct from empty" }
  8:  { name: protocol-pane,     note: "the one deliberately device-aware diagnostic surface — wire ids visible by design" }
  9:  { name: pattern-panel,     note: "the standard generator surface: run/stop with live state, pattern selection as an exclusive-choice group, knob sliders for whichever optional roles exist, source.background_run co-located with run/stop", required: true }
  10: { name: generator-advanced, note: "the fray-d surface: master controls + the four modifier lanes rendered as parallel lane groups + preset save/recall via the store, source.background_run co-located with the master run/stop", required: true }
  11: { name: transport,         note: "playback: play/pause/seek/queue cluster for hubs that play content" }
  12: { name: wizard,            note: "stepped ceremony flow: pairing, calibration, provisioning; glance-class projects it as sequential menu screens" }

# ---------------------------------------------------------------------------
# Well-known limits & defaults. SPEC.md Appendix G mirrors this table; the
# two MUST NOT diverge.
# ---------------------------------------------------------------------------
limits:
  header_bytes: 8
  min_transport_payload: 242        # ESP-NOW 250 − 8 header; STATE frames must fit this (§9.1)
  catalog_chunk_payload: 192
  blob_chunks_in_flight: 4          # RFC-050: advertised SENDER pacing budget — the max unacknowledged-by-application-progress BLOB_CHUNKs a sender may have outstanding for one transfer before it MUST hold emission (§8.4's backpressure table). Concrete answer to the panel's "what IS the signal" finding: a hub MAY advertise a smaller value, MUST NOT advertise more.
  bundle_max_samples: 32
  bundle_max_span_ms: 20
  seq_width_bits: 16
  seq_newer_window: 32768           # serial arithmetic half-window
  frag_reassembly_timeout_ms: 5000
  frag_max_concurrent_per_session: 2
  idempotency_ring_depth: 32
  intent_ingress_default_per_s: 50
  stream_ingress_overage_nack_per_s: 5   # §10.5: per-session cap on RATE_LIMITED NACKs emitted for STREAM-ingress overage (throttle — the NACK is back-pressure feedback, not a per-sample echo; unthrottled it would mirror the very flood it reports)
  event_queue_depth_per_subscriber: 16
  never_shed_stall_eviction_ms: 2000
  catalog_chunk_gap_timeout_ms: 500   # recommended (SHOULD)
  busy_retry_after_default_ms: 2000
  ping_interval_holding_control_ms: 200
  ping_interval_idle_ms: 1000
  deadman_default_ms: 600
  deadman_min_ms: 250
  deadman_max_ms: 5000
  pairing_window_default_s: 120
  pairing_pin_digits: 4
  pairing_gesture_boot_count: 3       # RFC-049g: N in §12.3(c)'s power-cycle gesture — this many CONSECUTIVE short boots arm the push-to-pair window on the next boot. Was prose-only ("N (default 3)"); the panel's own complaint pattern (registry doctrine says numbers are never left as hedges) applies to this one too.
  pairing_gesture_max_uptime_ms: 10000 # RFC-049g: the per-boot uptime ceiling that counts as "short" for the gesture above. Was prose-only ("~10 s") — the tilde was hedge language in a normative section; pinned here matching the value SPEC §12.3(c) already carried in prose. Reference-firmware conformance to this exact value is unverified by this pass — implementation is Phase D.
  token_bytes: 16
  instance_id_bytes: 8
  etag_bytes: 8
  conformance_min_clients: 4
  default_max_clients_ws: 8
  default_max_clients_espnow: 4
  default_max_clients_ble: 1
  default_max_clients_serial: 1
  estop_repeat_interval_ms: 50
  estop_repeat_max: 20
  clock_resync_interval_s: 10
  probe_default_bytes: 8192
  probe_max_duration_ms: 1500
  catalog_max_entries: 256
  catalog_max_entry_bytes: 4096     # feasibility pass: a 50-field FULLY annotated entry (defaults + options + groups + descs) encodes to ~8–10 KB, which violates RFC-028's no-unbounded-allocation rule for a per-entry decode buffer. Oversize is a catalog-AUTHORING error caught by conformance tooling, not a runtime surprise: the entry splits across channels or trims its descs.
  max_subscriptions_per_session: 64
  max_subscriptions_per_frame: 16   # RFC-033.3: wishes one SUBSCRIBE/HELLO frame may carry (= the reference decoder's kSubscribeMaxWishes, which was previously discoverable only by binary-searching a live hub). Advertised in WELCOME limits key 4; a hub MAY advertise less, never more than it decodes. Overflow answers SUBSCRIBE_REJECTED, never silence.

  # ---- per-binding max_frame defaults (RFC-021/033 finding: the registry had
  # NO max_frame default at all, so every binding invented one) --------------
  # max_frame is HEADER-INCLUSIVE: header_bytes + payload. That is what the
  # reference hub already advertises (kFrameBufferCapacity), and what
  # FRAME_TOO_LARGE is measured against. Payload budget = max_frame − 8.
  # A hub MAY advertise less; it MUST NOT advertise more than its binding.
  max_frame_ws: 512                 # = the reference hub's FrameBuffer capacity. Nothing NEEDS to be bigger: data-plane frames fit the 242 B floor by rule, blob chunks are catalog_chunk_payload + header, and oversized control frames fragment (§5.6). A fixed capacity keeps every queue slot heap-free on an ESP32.
  max_frame_espnow: 250             # the hard ESP-NOW MTU. Payload 250−8 = 242 = min_transport_payload; that subtraction is where the 242 B STATE floor came from in the first place.
  max_frame_ble: 244                # ATT_MTU 247 − 3 B notification header. Payload 236. A client stuck at the legacy 23 B MTU cannot carry a full STATE frame at all, which is why §13 SHOULD-mandates MTU exchange + data length extension before catalog transfer.
  max_frame_serial: 512             # byte-stream binding: no MTU of its own, so it matches the WS/buffer figure rather than inventing a third number.

  # ---- session lifecycle (RFC-015, RFC-024) --------------------------------
  catalog_ready_timeout_ms: 15000   # RFC-015: a session that PINGs happily but never sends CATALOG_READY is GOODBYE'd READY_TIMEOUT. Liveness reaping alone NEVER fires on a pinging client, so without this a half-adopted session holds a slot forever with both planes gated shut. (READY itself is re-sent by the client at catalog_chunk_gap_timeout_ms until retained STATE arrives — idempotent, no handshake state machine.)
  idle_reap_multiplier: 3           # RFC-024: reap a non-owning session after this multiple of ping_interval_idle_ms of silence. §6.5 said "MAY"; it was never implemented, so a viewer that went dark held a slot forever. Two liveness regimes, deliberately different: source OWNERS get the deadman window + §11.3 loss policy; everyone else gets idle reaping with no motion consequence.

  # ---- streaming (RFC-013, RFC-014, RFC-049c) ------------------------------
  max_future_schedule_ms: 250       # RFC-014: for segment-class STREAM channels, t_base + t_off[i] IS the intended execution start of sample i; the hub clamps scheduling this far ahead. It was already the shipped fw 2.1.45 behavior but registered NOWHERE — the MFP plugin carried a private SegLookaheadMs=120 against it. Interop by folklore, now by number. Recommended client lookahead <= half of this.
  max_burst_multiple: 4             # RFC-013: cap on `burst` relative to granted rate. An unbounded client-declared burst would reintroduce the exact flood the token bucket exists to stop.
  segment_handoff_k: 1.5            # RFC-049c: the H11 machine-side handoff-sanity bound (§9.6) — a hub SHOULD reject/bound an accepted end-velocity exceeding k * min(|chord_in|, |chord_out|). Was reference-implementation-only (the MFP plugin's own Fritsch-Carlson limiter and the firmware's boundHandoffVelocity both hardcoded 1.5 independently) — the panel quoted this registry's OWN doctrine ("a competing implementation has no authoritative source for the clamping constant") back at us. Pinned here so a second implementation matches shape without reverse-engineering the reference. Hub-side per-source scheduling-depth backstop (widening H11's lookahead-bounded coverage) is Phase D implementation, not a registry number.

  # ---- string caps (RFC-009, RFC-022.5, RFC-028.2) -------------------------
  # Reconciliation, normative: SENDERS truncate diagnostic strings to the cap;
  # RECEIVERS reject over-cap strings in STRUCTURAL payloads. `detail` is
  # diagnostic — an over-length NACK detail is TRUNCATED, never suppressed
  # (today's encoder returns 0 and the whole NACK silently vanishes).
  desc_max_bytes: 128               # RFC-009: per-field user-facing description. Flash-resident on the hub, travels once, etag-cached forever.
  nack_detail_max_bytes: 48         # RFC-022.5
  option_label_max_bytes: 24        # RFC-009.1: one label in a single-select `options` array. Matches the 24 B field-name cap so a label is never the thing that overflows an entry.

  # ---- stores & trust (RFC-021, RFC-027, RFC-029) --------------------------
  preset_capacity_min: 32           # RFC-021.6: conformance FLOOR for a store's declared capacity, not a cap. 32 fray-d presets ~ 1.5 KB NVS; the mechanism does not blink at 256. Small hubs declare less, the catalog says so, clients render accordingly.
  preset_item_max_bytes: 4096       # RFC-021.6 default per_item_max. The payload is opaque: the protocol never decodes it, so this is purely a transfer/storage budget.
  paired_devices_max: 8             # trust-ledger capacity. 8, matching the library's kMaxPaired TODAY (the RFC text said 16; the feasibility pass corrected it against the source). Also equals default_max_clients_ws, which is a coincidence worth not reading meaning into.
  trust_ledger_max_bytes: 1900      # feasibility pass: the whole encoded ledger is ONE blob in the existing `slopsync` NVS namespace and must stay inside a single ~2 KB NVS page. Written only on change, and gated on ota_active exactly like savePairing() — flash-cache writes during an OTA reset the chip.
  pairing_pending_max: 4            # RFC-027.2a: bounded knock list. Bounded because it is an unauthenticated queue — the one surface a stranger can fill.
  client_ver_max_bytes: 24          # HELLO `trust`.client_ver. Registered as a NUMBER (the trust_keys note only stated it in prose) because RFC-028.2 makes registry string caps a PARSE-TIME obligation: a receiver rejects an over-cap string in a structural payload rather than truncating and continuing, and it cannot enforce a cap that exists only in English. Same value bounds the trust-ledger `version` field, so the tripwire never compares a truncated value against a full one.
  trust_ledger_name_max_bytes: 16   # trust-ledger `name`. 16 to match the 0x0002 roster's str16 rather than HELLO's 32: a roster label is a label, and the authoritative full name rides HELLO/0x0007 while the session lives.
  trust_ledger_kind_max_bytes: 16   # trust-ledger `kind`. Equals the HELLO client_kind cap, so a kind is recorded whole and never appears to change between sessions.
  hub_sig_timeout_ms: 3000          # RFC-029 item 1: how long a client that REQUESTED a hub signature AND holds a pinned key waits before calling the absence a failure. Generous on purpose — one software ECDSA is ~30-80 ms, but it is queued behind whatever the hub's low-priority worker is already doing, and a hub is allowed to be busy. A client with NO pinned key never applies this timeout: it has nothing to verify against, and silence from a hub that simply has no keypair is conformant, not suspicious.
  auth_attempts_max: 3              # RFC-029 item 6: failed AUTH (0x1C) proofs a session may present before the hub stops answering and GOODBYEs it. Mirrors §12.2's "three failures close the PIN window" verbatim rather than inventing a second number. The proof is 16 bytes, so this is not what makes guessing infeasible — it is what stops an unauthenticated peer spending the hub's HMAC budget in a loop.

  # ---- logging (RFC-017) ---------------------------------------------------
  log_replay_depth_default: 32      # entries the hub MAY replay from its ring tail when a session is granted the log channel. THE named exception to §9.4's no-replay rule ("except where a channel's catalog entry declares a replay depth"); the actual depth is declared per-entry, this is the default. 32 lines is roughly "what went wrong just before I connected" without making every grant a burst.

  ws_subprotocol: "slopsync.v1"
  mdns_service: "_slopsync._tcp"
