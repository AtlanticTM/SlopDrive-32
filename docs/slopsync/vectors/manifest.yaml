# SlopSync golden-vector manifest (slopsync/1) — NORMATIVE as to coverage (SPEC.md §17.2, Appendix F)
#
# Byte-exact vector files (*.bin + *.expected.yaml) are GENERATED by slopsync-core
# tooling once it exists, using the injected clock/RNG mandated by SPEC.md §17.2,
# from the fixed inputs defined here. This manifest defines WHAT must be covered
# and the exact inputs; the generated bytes become normative when tagged.
#
# Fixed identities used by every vector (arbitrary but frozen forever):
fixtures:
  hub_boot_id: 0xB007CAFE
  hub_time_origin_us: 1000000            # injected clock starts here
  session_id: 0x5E551D01
  instance_id: "0102030405060708"        # hex
  token: "000102030405060708090A0B0C0D0E0F"
  nonce: "A1A2A3A4A5A6A7A8"
  pin: "4821"
  catalog: "fixtures/mini-catalog.yaml"  # 6-entry catalog exercising every field type,
                                         # both layout and schema forms, one bitfield8
  # FROZEN AT THE v1.0 TAG (K-01 and K-02 pins). Changing the fixture moves both
  # and is a protocol break, not a refactor — SPEC §17.2.
  catalog_encoded_bytes: 775
  catalog_etag: "F4A28FBB58CED16A"

suites:
  header:
    - id: H-01  # encode/decode every frame type's header, seq 0 and 0xFFFF
    - id: H-02  # len bounds: 0, 242, 65535; FRAME_TOO_LARGE behavior
    - id: H-03  # unknown frame type 0x7A skipped without disconnect (SPEC §4.3)
    - id: H-04  # flags: reserved bits set on receive -> ignored

  cbor_profile:
    - id: C-01  # HELLO minimal (viewer, no token) — exact bytes
    - id: C-02  # HELLO full (token, etag, wish-lists) — exact bytes, sorted keys
    - id: C-03  # WELCOME with grants, limits, nonce — exact bytes
    - id: C-04  # profile violations rejected: indefinite length, unsorted keys,
                #   float64, tag present -> PROFILE_VIOLATION (decode direction)
    - id: C-05  # unknown map key 99 ignored (SPEC §4.3)
    - id: C-06  # canned-template equivalence: template-patched HELLO == encoder HELLO

  catalog:
    - id: K-01  # mini-catalog deterministic encoding — exact bytes
    - id: K-02  # etag computation over K-01 bytes — exact 8-byte value
    - id: K-03  # chunking at 192B: chunk boundaries, indices, reassembly
    - id: K-04  # selective repair: request chunks [1,3], receive, complete
    - id: K-05  # etag mismatch -> static-profile degraded-mode decision table (SPEC §8.5)

  state_stream:
    - id: D-01  # STATE snapshot encode/decode for each mini-catalog layout
    - id: D-02  # newest-wins: seq 10 then 9 -> 9 dropped; wraparound 0xFFFE..0x0001
    - id: D-03  # STATE fit rule: 243-byte layout -> conformance tooling MUST flag
    - id: D-04  # STREAM bundle: 5 samples @240Hz (span 16.7ms < 20ms cap), t_base/t_off exactness
    - id: D-05  # bundle caps: 33 samples / 21ms span / MTU overflow all rejected
    - id: D-06  # append-only evolution: reader with short layout parses long payload prefix

  intent_echo:
    - id: I-01  # INTENT set-speed 420 -> ECHO applied 400 (clamp), cfg_gen bump
    - id: I-02  # duplicate intent_id -> identical stored ECHO, no re-apply
    - id: I-03  # precondition cfg_gen mismatch -> NACK CONFLICT
    - id: I-04  # NACK safety range: NOT_HOMED refusal on move intent

  estop:
    - id: E-01  # ESTOP frame bytes: cause/origin/seq/CRC — exact 12 bytes
    - id: E-02  # magic scanner: detect at offsets 0..3 in a byte stream; CRC reject
    - id: E-03  # COBS interaction: ESTOP inside COBS frame; corrupt-stream raw scan
    - id: E-04  # repeat-until-latch: 30% injected loss, latch observed within budget

  session_behavior:  # run against in-process binding, deterministic mode (SPEC §13.6)
    - id: S-01  # cold connect -> retained push -> LIVE gate (SPEC §2.2, §6.3)
    - id: S-02  # reconnect: etag match skip; boot_id change forces full SYNCING
    - id: S-03  # reconnect reconcile: pending intent NOT retransmitted (SPEC §6.8)
    - id: S-04  # duplicate instance_id evicts old session
    - id: S-05  # deadman: streamer silent 600ms -> STOP latched, cause=deadman
    - id: S-06  # deadman: pattern initiator lost -> pattern continues, ownership released
    - id: S-07  # takeover: SOURCE_CONFLICT then takeover=true transfer + event
    - id: S-08  # shed order under congestion: background stream decimates before
                #   elevated; safety STATE never sheds; slow-consumer eviction
    - id: S-09  # unsolicited GRANT on second client join; client complies
    - id: S-10  # pairing: PIN proof HMAC exact bytes; wrong PIN -> PAIRING_DENIED;
                #   3 failures close window

  clock:
    - id: T-01  # CLOCK t0/t1/t2 exchange: offset & RTT math — exact values
    - id: T-02  # µs wraparound: t_base near 0xFFFFFFFF interpreted in ±35min window

  # ---- public v1.0 additions -----------------------------------------------
  # Coverage for everything the v1.0 base pass added to the wire. Listed here
  # because SPEC Appendix F calls this manifest NORMATIVE AS TO COVERAGE: a
  # frame type with no row here would be an unstated hole, not an omission.
  #
  # HONEST STATUS: these rows define required coverage; the byte files for them
  # are NOT yet generated. See SPEC §18-7 for what the FROZEN mini-catalog
  # fixture cannot cover at all (it carries no RFC-009 annotations and no
  # safety INTENT channel, so per-op `access`, `option_access` and the role
  # exemption are behavioral-test-only until a v1.1 fixture pass — which would
  # move the 775 B / F4 A2 8F BB 58 CE D1 6A pins and therefore was NOT done at
  # the v1.0 tag).
  readiness:                                          # RFC-015, SPEC §6.4
    - id: R-01  # CATALOG_READY raw frame: exact 8-byte etag payload; wrong length rejected
    - id: R-02  # HELLO etag match -> ready at WELCOME, retained push immediate
    - id: R-03  # etag absent -> data plane silent until CATALOG_READY; INTENT -> NACK NOT_READY
    - id: R-04  # idempotent re-send: duplicate CATALOG_READY changes nothing
    - id: R-05  # degraded static client READYs with a STALE etag; hub serves it
    - id: R-06  # catalog_ready_timeout_ms elapsed -> GOODBYE READY_TIMEOUT

  blob:                                               # RFC-021, SPEC §8.4/§8.7
    - id: B-01  # BLOB_REQ full, ns=0 -> chunk sequence identical to K-03's byte ranges
    - id: B-02  # BLOB_CHUNK 14-byte header: field order/endianness — exact bytes
    - id: B-03  # empty `chunks` array -> MALFORMED (RFC-022.6, as actually enforced)
    - id: B-04  # catalog namespace carrying store_id/slot -> MALFORMED
    - id: B-05  # unknown store_id -> CHUNK_UNAVAILABLE; store access above role -> ACCESS_DENIED
    - id: B-06  # total_bytes lets a receiver refuse before assembling (SPEC §5.8-1)

  publish_grants:                                     # RFC-013, SPEC §6.7/§10.5
    - id: P-01  # HELLO publishes wish with burst -> granted_publishes echo, exact bytes
    - id: P-02  # burst clamped to rate x max_burst_multiple(4) and echoed
    - id: P-03  # PUBLISH (0x18) mid-session add/change/drop -> GRANT result
    - id: P-04  # PUBLISH granting nothing still answers with an empty granted_publishes
    - id: P-05  # token bucket: bundle overdraw -> whole-bundle drop + throttled RATE_LIMITED

  trust:                                              # RFC-027/029, SPEC §12
    - id: X-01  # HELLO `trust` sub-map encode/decode; absent map = unchanged floor
    - id: X-02  # hub signature material: client_nonce(8)||session_id(u32 LE)||boot_id(u32 LE)
    - id: X-03  # HUB_SIG (0x1D) envelope = one-key map {39:{5:sig}}; missing 39 -> MALFORMED
    - id: X-04  # AUTH (0x1C) token proof = HMAC-SHA256(token, WELCOME nonce)[:16], exact bytes
    - id: X-05  # auth_attempts_max failures -> session closed
    - id: X-06  # knock-and-approve: bare PAIR_REQ -> pending list; pair_approve -> PAIR_GRANT
    - id: X-07  # trust ledger item encode per trust_ledger_keys; revoked device = absent entry
    - id: X-08  # client_ver change -> recognized_pending, admitted at watch, role suspended

  events_body:                                        # SPEC §9.4
    - id: V-01  # EVENT with `body` (40) keyed by the channel's own schema — exact bytes
    - id: V-02  # safety edge kinds emitted on TRANSITIONS only; repeat ESTOP re-STATEs, no re-edge
    - id: V-03  # log channel replay on grant, bounded by the entry's replay_depth

  parser_totality:                                    # RFC-028, SPEC §5.8/§17.4
    - id: Z-01  # tstr/bstr length claiming 2^64-1 -> rejected, no read past buffer
    - id: Z-02  # refused over-capacity transfer must not retain the attacker's numbers
    - id: Z-03  # over-cap structural string rejected; over-cap NACK `detail` TRUNCATED, never dropped
    - id: Z-04  # depth-5 CBOR document rejected without recursion blowup

  # ---- RFC-030..042 batch (2026-07-26/27) -- HOLE, not yet covered here -----
  # This manifest predates the RFC-030..042 batch (curve_family, deadman_wish_ms,
  # session-admin, the identity codec, etc. all landed after the rows above were
  # written). Per line 1's own "NORMATIVE as to coverage" rule, an uncovered
  # feature must get an explicit hole row here, not silence. Each id below has
  # BEHAVIORAL (non-byte-exact) coverage today in
  # test/native/test_slopsync_streamingress/test_main.cpp (cited); no
  # golden-vector .bin/.expected.yaml exists yet for any of them.
  admin_and_negotiation:
    - id: N-01  # hole: no vectors yet -- RFC-010 safety_ops::estop as an INTENT op
                #   on 0x0005 (op encode + effect, exact bytes); no dedicated
                #   byte-exact vector, only the raw-frame ESTOP path (E-01..E-04)
    - id: N-02  # hole: no vectors yet -- RFC-018 session-admin (0x0009 INTENT)
                #   {op: evict, session_id} -> GOODBYE, exact bytes
    - id: N-03  # hole: no vectors yet -- RFC-030 curve_family: wish -> effective
                #   value echo, exact bytes; behavioral coverage: SI-23
    - id: N-04  # hole: no vectors yet -- RFC-038 deadman_wish_ms: clamp to
                #   registry bounds, echoed applied on key 24, exact bytes;
                #   behavioral coverage: SI-22
    - id: N-05  # hole: no vectors yet -- RFC-016(a) WELCOME `identity` (key 37)
                #   codec: product/fw_version/hub_name, emit-only-when-set,
                #   exact bytes; behavioral coverage: SI-24
