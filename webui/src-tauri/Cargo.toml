[package]
name = "slopdeck"
version = "0.1.0"
description = "SlopDeck - the SlopSync client shell"
authors = ["AtlanticTM"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Rust-side fetch: /uitoken minting from a native origin (main.js shell branch)
tauri-plugin-http = "2"
# BLE central (RFC-043 client side): btleplug on desktop, native Kotlin on Android
tauri-plugin-blec = "0.12"
