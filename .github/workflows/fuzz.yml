name: fuzz

# RFC-028 parser-totality gate for lib/slopsync.
#
# The library is header-only, zero-dependency and hardware-free, so every
# fuzz target is ONE clang invocation over ONE .cc file. There is deliberately
# no PlatformIO here: PIO exists in this repo to build FIRMWARE, and it adds
# a toolchain download and a framework it cannot use to a build that needs
# neither. If this workflow ever needs PIO, something has been included into
# lib/slopsync that does not belong there.
#
# PR runs are short (smoke: does every target still build, and does the
# committed corpus still replay clean?) plus a brief mutation budget.
# The nightly run is the real soak.

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'lib/slopsync/**'
      - 'test/fuzz/**'
      - '.github/workflows/fuzz.yml'
  pull_request:
    paths:
      - 'lib/slopsync/**'
      - 'test/fuzz/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '17 4 * * *'   # nightly soak
  workflow_dispatch:
    inputs:
      seconds_per_target:
        description: 'Fuzzing seconds per target'
        required: false
        default: '300'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_cbor
          - fuzz_catalog
          - fuzz_frame
          - fuzz_packed
          - fuzz_bundle
          - fuzz_blob
          - fuzz_messages

    steps:
      - uses: actions/checkout@v4

      - name: Install clang + libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
          clang++ --version

      # Corpus directory names mirror the target names minus the `fuzz_`
      # prefix (see test/fuzz/run.sh, which uses the same mapping).
      - name: Derive corpus name
        id: corpus
        run: echo "name=${TARGET#fuzz_}" >> "$GITHUB_OUTPUT"
        env:
          TARGET: ${{ matrix.target }}

      - name: Build ${{ matrix.target }}
        run: |
          clang++ -std=c++2b -O1 -g -fno-omit-frame-pointer \
            -Wall -Wextra -Wno-unused-private-field \
            -I lib/slopsync/include -I test/fuzz \
            -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=undefined \
            test/fuzz/${{ matrix.target }}.cc -o ${{ matrix.target }}

      # Replaying the committed corpus with -runs=0 is the cheap, deterministic
      # half of the gate: it re-executes every regression seed, so a
      # reintroduced parser bug fails here in seconds even if the mutation
      # budget below would have missed it.
      - name: Replay committed corpus (deterministic)
        env:
          ASAN_OPTIONS: abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mkdir -p artifacts
          ./${{ matrix.target }} test/fuzz/corpus/${{ steps.corpus.outputs.name }} \
            -runs=0 -artifact_prefix=artifacts/

      - name: Choose budget
        id: budget
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "secs=1800" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.seconds_per_target }}" ]; then
            echo "secs=${{ github.event.inputs.seconds_per_target }}" >> "$GITHUB_OUTPUT"
          else
            echo "secs=60" >> "$GITHUB_OUTPUT"
          fi

      # -max_len 8192: several findings in this gate's first pass only
      # reproduce on inputs longer than the corpus's natural maximum (an
      # intra-object overflow needs a write long enough to leave the whole
      # object before ASan can see it). Do not lower this.
      - name: Fuzz ${{ matrix.target }} (${{ steps.budget.outputs.secs }}s)
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mkdir -p work/${{ steps.corpus.outputs.name }} artifacts
          ./${{ matrix.target }} \
            work/${{ steps.corpus.outputs.name }} \
            test/fuzz/corpus/${{ steps.corpus.outputs.name }} \
            -max_total_time=${{ steps.budget.outputs.secs }} \
            -max_len=8192 \
            -print_final_stats=1 \
            -artifact_prefix=artifacts/

      # Any crash/leak/timeout artifact is the whole point of the run — keep
      # it, minimized reproduction is a one-liner from the downloaded file.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: ignore

      # Nightly only: publish the grown corpus so a human can decide whether
      # to fold new coverage back into the committed seeds (test/fuzz/README).
      - name: Upload grown corpus (nightly)
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: work/${{ steps.corpus.outputs.name }}
          if-no-files-found: ignore

  # Independent of the fuzzers: the seed generator must keep building and
  # running clean, because a broken generator silently rots the corpus.
  seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Build + run gen_seeds
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          clang++ -std=c++2b -O1 -g -Wall -Wextra -Wno-unused-private-field \
            -I lib/slopsync/include -I test/fuzz \
            -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            test/fuzz/gen_seeds.cc -o gen_seeds
          ./gen_seeds /tmp/seeds
          find /tmp/seeds -type f | wc -l
