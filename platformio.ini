; PlatformIO Project Configuration File
; SlopDrive-32 - Multi-Device Machine Network
;
; This single workspace manages firmware for three separate ESP32 boards:
;   1. Main Controller:        Arduino Nano ESP32 (u-blox NORA-W106 / ESP32-S3)
;   2. Node A (Receiver):      Waveshare ESP32-C5-Zero
;   3. Node B (Transmitter):   ESP32-C5 (LilyGO T-Dongle C5)
;
; Board note (custom v0.0 controller PCB):
;   The main controller is NOT a bare devkit — it's an Arduino Nano ESP32 module
;   (16MB flash, 8MB PSRAM, NORA-W106). The C5 relay node is the tiny C5-Zero,
;   not the full-size Waveshare devkit. We keep the plain esp32s3/esp32c5
;   VARIANTS (raw-GPIO numbering) because config_api.h passes raw GPIO integers
;   straight to pinMode()/Wire.begin() — the Nano's Dx→GPIO remap layer would
;   only bite if we wrote D2/D3 literals, which we never do. :3
;
; Each environment uses build_src_filter to compile ONLY its own src/<node>/
; folder, keeping the three firmware images strictly isolated while living in
; one project.
;
; PLATFORM STRATEGY (unified as of the feat/cpp20-slopsync branch):
;   - ALL environments (S3 + C5) use the `pioarduino` community fork of
;     platform-espressif32, pinned to the SAME stable release ZIP (55.03.39 =
;     Arduino-ESP32 v3.3.9 / ESP-IDF v5.5.4). One platform family, one framework
;     version, GCC 13 with full C++23 (gnu++2b) everywhere — required for the
;     C++20 codebase direction (Ruckig, slopsync-core, board-traits if constexpr).
;   - The official platformio/platform-espressif32 registry package is no longer
;     used anywhere: it lags on silicon support (no C5) and pins Arduino core 2.x
;     (GCC 8.4, no C++20). The legacy esp32-s3-devkitc-1 env below is FROZEN on
;     it and deprecated — it will not compile C++20 sources.
;
; LIBRARY ISOLATION STRATEGY:
;   - S3 environments use [common_s3_libs] which includes NeoPixel,
;     ArduinoJson, and INA228 (see the list itself for exact versions).
;   - C5 environments use [common_c5_libs] which only includes ArduinoJson.
;     The C5 nodes are lean communication nodes — no BLE, no pixels.

; -----------------------------------------------------------------------------
; Common defaults used by every environment.
; -----------------------------------------------------------------------------
[platformio]
default_envs = s3_main
src_dir = src
lib_dir = lib
data_dir = data

; -----------------------------------------------------------------------------
; -----------------------------------------------------------------------------
[common]
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

; S3-only libraries — do NOT inherit these into C5 environments.
; NeoPixel fails on ESP32-C5.
; No step generator here: the RP2350 owns pulse generation (architecture.md
; section 1), so nothing on the S3 links a stepper library.
[common_s3_libs]
lib_deps =
	; Arduino.h includes Client.h unconditionally, and in chain LDF mode nothing
	; else on a headless build pulls the framework Network library in.
	Network
	adafruit/Adafruit NeoPixel@^1.11.0
	bblanchon/ArduinoJson@^7.2.0
	; NimBLE is GONE (operator ruling 2026-08-01). The BLE transport cost ~64 KB
	; of stack at init on a chip whose free heap was 36 KB, to serve discovery
	; that RFC-046 UDP already covers. Removing the dep is what actually frees
	; the memory -- undefining BLE_ENABLED alone still links the stack.
	; INA228 20-bit current/voltage monitor on the 36V bus (custom v0.0 board).
	; NOT an INA226 lib — the register map differs. Feeds sensorless homing. :3
	robtillaart/INA228@^0.3.0
	; SlopSync repo split (slopsync.pin pins the sha): lib/slopsync is consumed
	; from the sibling checkout, never vendored back into this tree. Header-only
	; (library.json has no srcDir build), so this registration exists purely to
	; get the sibling's include/ onto every S3 env's path via the LDF -- same
	; mechanism as the vendored ESP32Async pair below, just pointed outside the
	; repo instead of into it.
	symlink://../SlopSync/lib/slopsync


; C5 nodes only need ArduinoJson for lightweight packet parsing — no steppers,
; no BLE stack, no NeoPixel. Keeping it lean so the C5 doesn't choke. yippie! :3
[common_c5_libs]
lib_deps =
	bblanchon/ArduinoJson@^7.2.0


; =============================================================================
; S3 ENVIRONMENTS — stable production toolchain, do NOT add dev packages here
; =============================================================================

; -----------------------------------------------------------------------------
; [env:esp32-s3-devkitc-1] - DEPRECATED legacy devkit environment.
; FROZEN on the old stable platform (Arduino core 2.x / GCC 8.4). The source
; tree is moving to C++20/core-3.x APIs on the feat/cpp20-slopsync branch, so
; this env WILL NOT BUILD current sources. Kept only as a historical reference
; for the devkit board wiring; candidate for deletion at branch merge. :3
; -----------------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
; Old stable production platform — deliberately NOT migrated (see deprecation note).
platform = espressif32
board = esp32-s3-devkitc-1
framework = ${common.framework}
lib_deps =
	${common_s3_libs.lib_deps}
upload_port = \\.\COM9
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
board_build.f_cpu = 240000000L
; LDF chain mode — must be explicit so uploadfs target doesn't fall back to
; LDF=off and lose WiFi.h / framework header discovery. :3
lib_ldf_mode = chain
; Exclude C5-only source trees — they use C5-specific registers (chip_rst,
; USB_SERIAL_JTAG) that don't exist on the S3 and cause compile errors. :3
build_src_filter = +<*> -<c5_probe/*> -<quad_probe/*> -<rp2350_motion/*> -<rp2350_bench/*>
build_flags =
	-O2
	-Iinclude/system
	-Iinclude/motion
	-Iinclude/comms
	-Iinclude/ui
	-DDRIVER_AIM_SERVO
	; BLE is REMOVED from the S3 (operator ruling 2026-08-01, see
	; docs/c5-comms-offload.md §3). It cost ~64 KB of NimBLE stack plus a
	; 16,560 B port object to serve a transport used almost exclusively for
	; discovery, which UDP (RFC-046) already does. Do not re-add -DBLE_ENABLED
	; here: every BLE call site is guarded on it, so defining it is the whole
	; switch, and NimBLE is no longer in lib_deps to back it.
	; Modbus bus tools: motor configuration plus the encoder audit, never
	; motion (architecture.md section 1). A production build drops this flag
	; and ServoModbus/EncoderValidator leave the image entirely.
	-DSD32_MODBUS_TOOLS
	; ---- USB Serial backend: STAY ON THE USB-Serial/JTAG PERIPHERAL ----
	; DO NOT add -DARDUINO_USB_MODE=1 / -DARDUINO_USB_CDC_ON_BOOT=1 here.
	;
	; A previous "cleanup" added those two flags, which flipped `Serial` over to
	; the native USB-OTG TinyUSB CDC stack. That stack tears down and re-enumerates
	; on every DTR assert/deassert — i.e. every time MultiFunPlayer / Intiface opens
	; or closes the port. Any Serial.read()/print() touching the device mid-teardown
	; panics the chip → the exact "crashes on connect and disconnect" bug, plus the
	; re-enumeration changes the USB PID so the host often fails to even detect the
	; port. uhoh. :C
	;
	; With the flags ABSENT (as on the rock-solid main branch) the S3 uses its
	; hardware USB-Serial/JTAG bridge for `Serial`. That endpoint is stable across
	; host open/close — no teardown, no phantom panic, and a steady COM port the
	; host can find every time. We're keeping the golden hose plugged into the
	; reliable socket. :3
build_unflags = -Og

; --- Web UI served from a LittleFS filesystem partition (best practice) ---
; The HTML/CSS/JS live in the data/ folder and are flashed as a separate
; filesystem image, NOT compiled into the firmware. This keeps the firmware
; small, lets you edit the UI without recompiling C++, and is the standard
; ESP32 approach. Use the PlatformIO "Upload Filesystem Image" task (or
; `pio run -t uploadfs`) to push data/ to the device.
extra_scripts = pre:build_webui.py
board_build.filesystem = littlefs
; 8MB flash layout with a large filesystem partition for the web assets.
; The partition uses the spiffs subtype — PlatformIO handles LittleFS formatting
; on top of it via board_build.filesystem = littlefs. :3
board_build.partitions = default_8MB.csv

; targets = uploadfs, upload  ; commented out — use `pio run -t uploadfs -t upload`
;                               explicitly when the board is connected. Leaving this
;                               active causes `pio run` to fail with COM-not-found
;                               when building offline. :3

; -----------------------------------------------------------------------------
; [env:s3_main] - Main controller firmware for the custom v0.0 board.
;
; This is the REAL OS — identical source set + flags as the legacy
; esp32-s3-devkitc-1 env (src/main.cpp + src/comms/ + src/motion/ + src/system/
; + src/ui/, the full WebUI/WiFi/LittleFS/motion stack). The ONLY differences
; from legacy are board-specific: the Arduino Nano ESP32 board def, 16MB
; partitions, the USB-Serial flags the Nano needs, and the pinned COM port.

; -----------------------------------------------------------------------------
[env:s3_main]

; pioarduino stable release ZIP — SAME pin as the C5 envs (55.03.39 =
; Arduino-ESP32 v3.3.9 / IDF v5.5.4 / GCC 13). Unified workspace platform;
; unlocks C++23 (gnu++2b) for the C++20 codebase direction. :3
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
; Custom board def: boards/arduino-nano-esp32.json — the real v0.0 controller
; MCU is an Arduino Nano ESP32 (NORA-W106 / ESP32-S3, 16MB flash, 8MB PSRAM),
; NOT a bare devkit. Uses the plain esp32s3 variant so config_api.h's raw-GPIO
; pin numbers stay literal — no Dx remap surprises. :3
board = arduino-nano-esp32
framework = ${common.framework}
lib_deps = ${common_s3_libs.lib_deps}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
; Pin the port — the Nano ESP32 enumerates on COM11 here. Auto-detect otherwise
; grabs COM7 (an ESP32-C3) and esptool bails with "This chip is ESP32-C3, not
; ESP32-S3". Lock both upload + monitor so we never poke the wrong hole. :3
upload_port = COM11
monitor_port = COM11
board_build.f_cpu = 240000000L

; 16MB flash on the Nano ESP32 — give the WebUI/LittleFS room to stretch out. :3
board_build.partitions = default_16MB.csv

; LDF chain mode — same as legacy env, so uploadfs doesn't fall back to LDF=off
; and lose WiFi.h / framework header discovery during the FS image build. :3
lib_ldf_mode = chain

; FULL OS source set: compile everything EXCEPT the C5 trees. This is the
; whole WebUI/WiFi/motion OS. :3
build_src_filter = +<*> -<c5_probe/*> -<quad_probe/*> -<rp2350_motion/*> -<rp2350_bench/*>

; --- Web UI served from a LittleFS filesystem partition ---
; HTML/CSS/JS live in data/ and are flashed as a separate FS image, built by
; build_webui.py. Push with `pio run -e s3_main -t uploadfs`. Without this the
; web server has no files to serve and the browser gets nothing. uhoh :C
extra_scripts = pre:build_webui.py
board_build.filesystem = littlefs

; ---- Static analysis (memory-safety doctrine §3) ----------------------------
; Two analyzers on purpose: their catch sets overlap only partly and both are
; cheap. Run with `pio check -e sd32-ota`.
; check_src_filters keeps them off the framework, the vendored ESP32Async pair
; and lib_deps — same scoping rule as build_src_flags and .clang-tidy's
; HeaderFilterRegex, for the same reason: we do not own that code.
check_tool = clangtidy, cppcheck
check_src_filters =
	+<src/>
	+<include/>
check_flags =
	clangtidy: --config-file=.clang-tidy
	cppcheck: --enable=warning,performance,portability --inline-suppr

; Decode every panic backtrace to file:line automatically on the serial monitor.
; The device's own /api/log is still the primary diagnostics channel (serial is
; not attached in normal use), but when it IS attached this is free.
monitor_filters = esp32_exception_decoder

; ---- MEMORY-SAFETY WARNING SET (.claude/rules/cpp-safety.md) -------
; build_src_flags, NOT build_flags, and that distinction is the whole reason
; this is enforceable: it applies to src/ only, so the Arduino core, ESP-IDF and
; the two VENDORED ESP32Async libraries are not compiled under it. Those are
; third-party, tracked upstream, and full of constructs this set rejects --
; -Werror across them would mean choosing between a red build and patching code
; we re-vendor. Our code gets held to the bar; their code does not.
; Vendored HEADERS still reach us through src/, which is why their include paths
; are -isystem below.
build_src_flags =
	-Wall -Wextra
	-Wconversion -Wsign-conversion
	-Wshadow -Wdouble-promotion
	-Wnon-virtual-dtor -Woverloaded-virtual
	; ---- FATAL: the memory-lifetime set ------------------------------------
	; Blanket -Werror is NOT viable yet and this is the honest half-step. Of the
	; 509 warnings the set above found on first enable, most are -Wshadow and
	; -Wconversion, and a large share come from third-party HEADERS
	; (NimBLE, INA228, StrokeEnginePatterns) that reach the compiler through
	; src/ and cannot be -isystem'd away because PlatformIO adds lib_deps paths
	; as -I. Making those fatal today would mean a red build we cannot fix.
	;
	; These, though, are the classes that actually corrupt memory, they are the
	; classes this codebase has actually been bitten by, and our code is clean
	; on all of them RIGHT NOW -- so they become errors before that stops being
	; true. -Wdangling-reference already earned its place: it found a real
	; range-for-over-temporary in SlopSyncHubService::loadPresets() the first
	; time it ran.
	; Widen toward full -Werror as the shadow/conversion backlog burns down.
	-Werror=dangling-reference
	-Werror=dangling-pointer
	-Werror=use-after-free
	-Werror=free-nonheap-object
	-Werror=return-type
	-Werror=uninitialized
	-Werror=array-bounds
	-Werror=stringop-overflow
	-Werror=nonnull
	-Werror=sizeof-pointer-memaccess

build_flags =
	-O2
	-DNODE_ROLE_MAIN_CONTROLLER=1
	-DNODE_ROLE=0
	; Include paths + driver selection — MUST match legacy env or main.cpp and
	; the motion/comms/ui modules won't find their headers / driver impl. :3
	-Iinclude/system
	-Iinclude/motion
	-Iinclude/comms
	-Iinclude/ui
	; Header-only ecosystem libs (lib/) — explicit -I because LDF's chain scan
	; doesn't reliably follow the nested project-header include path to them,
	; and header-only means there is nothing for LDF to compile anyway. :3
	-Ilib/sloplog/include
	-Ilib/slopglow/include
	-Ilib/slopmotion/include
	-Ilib/ruckig/include
	-DDRIVER_AIM_SERVO
	; BLE is REMOVED from the S3 (operator ruling 2026-08-01, see
	; docs/c5-comms-offload.md §3). It cost ~64 KB of NimBLE stack plus a
	; 16,560 B port object to serve a transport used almost exclusively for
	; discovery, which UDP (RFC-046) already does. Do not re-add -DBLE_ENABLED
	; here: every BLE call site is guarded on it, so defining it is the whole
	; switch, and NimBLE is no longer in lib_deps to back it.
	; SlopSync over UART to the ESP32-C5 comms bridge (Serial2, GPIO43/44).
	; The C5 terminates WiFi/WS and relays whole frames; see
	; docs/c5-comms-offload.md. Every UART call site is guarded on this.
	-DUART_LINK_ENABLED
	; Modbus bus tools: motor configuration plus the encoder audit, never
	; motion (architecture.md section 1). A production build drops this flag
	; and ServoModbus/EncoderValidator leave the image entirely.
	-DSD32_MODBUS_TOOLS
	; AsyncTCP's own default is 8192*2 = 16 KB. The live stack census (fw 2.1.90,
	; `stack async_tcp` in /api/log) measured a 792 B peak — field bug #5 moved
	; frame handling OFF this task onto the hub task, so these callbacks now only
	; enqueue. 8192 is ~10x the measured peak and is the value env:sd32-async has
	; always used. Reclaims 8 KB of internal heap, the scarce resource here (see
	; LEDGER's memory-pressure entry). RAISE this, never lower it, if real work
	; ever moves back onto the AsyncTCP callback task.
	-DCONFIG_ASYNC_TCP_STACK_SIZE=8192
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	; ---- C++23 everywhere (gnu++2b, GCC 13) ------------------------------
	; The whole point of the pioarduino migration: modern standard for Ruckig,
	; slopsync-core, ETL, and constexpr board traits. The matching unflags strip
	; whatever default -std the framework builder injects. :3
	-std=gnu++2b
build_unflags =
	-Og
	-std=gnu++11
	-std=gnu++14
	-std=gnu++17
	-std=gnu++2a
	-std=gnu++20

; ---- IDF memory/network config (LEDGER: ACTIVE TASK 1, items 2-5) -----------
; THIS BLOCK REBUILDS THE ESP-IDF LIBRARIES FROM SOURCE. pioarduino's
; call_compile_libs() (builder/frameworks/arduino.py) wipes and reinstalls the
; framework packages, so the first build after any edit here is long and the
; resulting image is a DIFFERENT IDF build lineage than a stock-libs build.
; Do not add a value here casually, and do not A/B a memory measurement across
; an edit to this block without re-taking the baseline.
;
; It lives in env:s3_main, not in env:sd32, ON PURPOSE: the serial rescue path
; (env:sd32) and the routine OTA path (env:sd32-ota) MUST share one network
; stack configuration. A rescue image whose lwIP behaves differently from the
; image it is rescuing is a debugging trap, not a safety net.
custom_sdkconfig =
	; The 8 MB of PSRAM sat untouched while WiFi and lwIP fought over ~36 KB of
	; internal. This is the single biggest lever in the task. PSRAM on this
	; board is OCTAL at 80 MHz (board def memory_type = qio_opi ->
	; CONFIG_SPIRAM_MODE_OCT; the generic esp32s3/sdkconfig showing QUAD is a
	; different variant's file and does NOT describe this board), so the bus is
	; 8 bits wide and has real headroom. It is still shared with the cache and
	; the PSRAM-resident SlopSync catalog, which is why the Sampler reading is
	; part of the post-change A/B rather than an afterthought.
	; EXONERATED BY A/B, 2026-07-31 — keep this ON.
	; It was suspected of causing the heap corruption in THE QUEUE item 0,
	; because the corruption crash lands in tlsf `remove_free_block` (the
	; allocator walking its own free list, EXCCAUSE 29 LoadProhibited) reached
	; via `wifi_calloc` -> `heap_caps_calloc_prefer` — exactly the allocation
	; path this option redirects into PSRAM.
	; TESTED: built with it OFF (fw 2.2.8) and the SAME crash reproduced, same
	; task, same EXCCAUSE, same frames. The corruption is NOT ours and NOT
	; this option's.
	; Turning it off also measurably HURT: idle int_free 41 967 -> 34 039,
	; int_largest 28 660 -> 18 420. That headroom is what makes deeper
	; buffering affordable (see WS_MAX_QUEUED_MESSAGES, left at 32 because
	; raising it once drove heap low-water to 208 B — a calculus written
	; BEFORE wifi/lwIP moved out of internal).
	; TO TURN THIS OFF, COMMENT THE LINE OUT — never write `=n`. pioarduino
	; substitutes the literal text into sdkconfig and Kconfig rejects `=n` for a
	; bool (it wants `# CONFIG_X is not set`), so `=n` fails the IDF build with a
	; CMake error that names idf_build_process and not this line. The framework
	; default here is already "not set", so omitting it is how you disable it.
	CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
	; Was 0, which is why a MUTEX allocation killed the machine: with no
	; reserve, bulk allocations that COULD have gone to PSRAM are free to drain
	; internal to nothing, and the next allocation that MUST be internal
	; (mutexes, DMA descriptors, ISR-safe work) aborts. lock_init_generic() was
	; the victim in the 2.1.99 core dump. With a reserve, that same pressure
	; degrades to a refused connection instead of an abort.
	CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=32768
	; THE BROWSER-FACING CAP. AsyncTCP allocates raw lwIP PCBs
	; (tcp_new_ip_type/tcp_write via tcpip_api_call), NOT BSD sockets, so THIS
	; is the knob that bounds a page load — LWIP_MAX_SOCKETS below is a
	; different layer and does not limit HTTP/WS clients at all. Do not
	; "consolidate" the two.
	; 8, not 6: one browser tab opens up to 6 parallel connections per host and
	; then a WebSocket on top = 7 from a single tab. TIME_WAIT PCBs draw from
	; this same pool (lwIP reaps the oldest when it is exhausted), so 6 would
	; refuse asset requests mid-page-load and read as flaky WiFi.
	CONFIG_LWIP_MAX_ACTIVE_TCP=8
	; The BSD socket/netconn layer. In this firmware only mDNS and
	; SlopSyncUdpDiscovery use it; 10 bounds the table without starving them.
	CONFIG_LWIP_MAX_SOCKETS=10
	; Per-connection ceilings, not reservations — pbufs are allocated on
	; demand, so this bounds the WORST case and will not move idle free heap.
	; STOCK, AND MEASURED — DO NOT HALVE THESE AGAIN.
	; They were cut to 2880 on 2026-07-31 to bound per-connection internal RAM.
	; Measured A/B on the same machine, same bundle (115 970 B):
	;     2880  -> cold page load 8.99 s   (12.9 KB/s)
	;     5744  -> cold page load 0.98 s  (119   KB/s)
	;   heap cost of restoring: int_free 41 107 -> 41 103, int_largest
	;   28 660 -> 28 660. I.e. NONE.
	; ~9x throughput for zero measurable heap, because these are per-connection
	; CEILINGS filled on demand, not reservations — the worst case they bound
	; never materialized, while the steady-state cost was paid on every load.
	; If per-connection RAM ever genuinely needs bounding, bound the CONNECTION
	; COUNT (LWIP_MAX_ACTIVE_TCP above), which costs nothing until the cap is
	; actually reached.
	CONFIG_LWIP_TCP_SND_BUF_DEFAULT=5744
	CONFIG_LWIP_TCP_WND_DEFAULT=5760
	; NOT a tuning choice — this unbreaks the build. The shipped defaults pair
	; TIMEOUT_MS_RESPOND=10000 with MAX_API_BLOCKING_TIME_MS=6000, which fails
	; esp-modbus's own _Static_assert (blocking time must be >= respond
	; timeout). It only bites once the IDF is built FROM SOURCE, because stock
	; precompiled libs never re-evaluate the assert — so this line is a
	; dependency of the block above, not an independent decision.
	; We do not use this component at all (the RS485 servo link is our own
	; ServoModbus, FC 0x10; nothing outside managed_components/ references
	; esp-modbus). Dropping it via custom_component_remove would save flash and
	; is the better long-term answer, deliberately NOT done in the same change
	; as a memory measurement.
	CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=10000
	; TASK WATCHDOG vs THE SYNC WEBSERVER'S OWN CEILING. Was 5 s, with
	; CHECK_IDLE_TASK_CPU0=y and PANIC=y — i.e. a 5 s stall on Core 0 reboots
	; the machine. The Arduino sync WebServer that serves /api/* on httpTask
	; (Core 0) declares HTTP_MAX_DATA_WAIT / HTTP_MAX_SEND_WAIT /
	; HTTP_MAX_POST_WAIT = 5000 ms each, so the watchdog was armed EXACTLY at
	; the supervised code's own documented worst case. Any client that opens a
	; connection and stops mid-request walks the device onto that boundary.
	; REPRODUCED 2026-07-31 on fw 2.2.1: five half-open HTTP connections ->
	; /api/tasks unreachable -> reset_reason TASK_WDT, every time, with
	; heap_min 40 619 B (i.e. NOT a memory failure). Eight COMPLETE keep-alive
	; requests over the same socket count survive untouched.
	; A watchdog must sit ABOVE the bounded waits of what it supervises or it
	; fires on correct-but-slow, not on hung. 12 s clears the 5 s ceiling with
	; margin and still catches a true hang.
	; THIS BOUNDS THE DAMAGE, IT IS NOT THE CURE: a half-open client still
	; monopolizes the single-client sync server for up to 5 s. The cure is to
	; stop serving /api/* from a one-client-at-a-time server (see
	; docs/http-plane-retirement.md); this line only turns a reboot into a
	; delay.
	CONFIG_ESP_TASK_WDT_TIMEOUT_S=12
	; UART RX ISR must survive flash-cache-off windows (sd-6kz.1). Serial OTA
	; writes flash ON the receive path (pumpRx -> Update.write), and a
	; flash-resident ISR is held off while the cache is disabled -- the 128 B
	; hardware FIFO then overflows 0.64 ms into every write at 2 Mbaud, BELOW
	; every driver counter. That was "first send of every chunk lost, only the
	; retry lands": the retry always arrived after the write finished. In IRAM
	; the ISR keeps draining into the 32 KB ring, whose ~164 ms of runway covers
	; even a 30-80 ms lazy sector erase. Also protects Serial1 (Modbus
	; telemetry) through HTTP OTA flash writes for the same reason.
	CONFIG_UART_ISR_IN_IRAM=y
	; ---- HEAP DIAGNOSTICS: STRIPPED BY OPERATOR RULING 2026-08-01 -----------
	; `CONFIG_HEAP_POISONING_COMPREHENSIVE`, `CONFIG_HEAP_TRACING_STANDALONE`,
	; `CONFIG_HEAP_TRACING_STACK_DEPTH` and `CONFIG_HEAP_USE_HOOKS` lived here to
	; hunt LEDGER THE QUEUE item 0, which is PARKED. They cost a memset plus a
	; verify plus a hook call on every alloc and free, on a device with a 1 kHz
	; motion loop -- which makes any timing measurement measure the poisoner.
	; The DIR ladder is a timing measurement, so they came out. Full ruling and
	; what it costs (the next field crash from the residual corruption is mute)
	; live in docs/canon/LEDGER.md.
	; RE-ADD ALL FOUR TOGETHER if the corruption hunt reopens -- HEAP_USE_HOOKS
	; is the one that makes the other three do anything, and tracing without it
	; is INERT while still reporting active:true. `-DSLOPSYNC_HEAP_BISECT=1`
	; (env:sd32 build_flags) went out under the same ruling and comes back with
	; them.


; =============================================================================
; OTA ENVIRONMENTS — network firmware + web-UI flashing for the main controller
; =============================================================================
;
; [env:sd32]      — serial/USB bench + rescue path. Behaves EXACTLY like s3_main
;                    (same source set, flags, COM port) but pins the vendored,
;                    OTA-capable partition table (partitions_ota.csv, byte-
;                    identical to default_16MB.csv so the one-time migration
;                    doesn't relocate NVS/LittleFS). Use this for the ONE cabled
;                    flash that installs the first OTA-able firmware, and later
;                    only for rescue (bootloop / WiFi-breaking change).
;
; [env:sd32-ota]  — the DEFAULT routine path. Same build as sd32, but uploads
;                    over the network via ArduinoOTA (espota) to the device IP.
;                      Firmware : pio run -e sd32-ota -t upload
;                      Web UI   : pio run -e sd32-ota -t uploadfs
;                    The OTA auth secret is NOT hardcoded here — tools/ota_auth.py
;                    reads SECRET_OTA_PASSWORD from include/secrets.h at build
;                    time and appends `--auth=<secret>` to the espota flags, so
;                    the password never lands in a committed file. :3
; -----------------------------------------------------------------------------
[env:sd32]
extends = env:s3_main
; Vendored OTA partition table (nvs + otadata + ota_0/ota_1 + spiffs + coredump).
; Byte-identical layout to default_16MB.csv → NVS + LittleFS survive the one-time
; serial migration that installs the first OTA-capable image.
board_build.partitions = partitions_ota.csv
; ---- ESP32Async is THE transport (M5c) -------------------------------------
; Not optional: SlopSyncHubService names SlopSyncAsyncWsPort unconditionally,
; so every environment that compiles src/ needs it. History: docs/http-plane-retirement.md.
; sd32-async is kept as an alias so existing commands/docs keep working. It is
; now a PURE alias: -DCONFIG_ASYNC_TCP_STACK_SIZE=8192 moved up into env:s3_main
; (measured, see the flag's comment there), so both envs build the same stack.
;
; 'Hash' is deliberately NOT lib_ignore'd. It is an esp8266-only dependency of
; upstream ESPAsyncWebServer, but ignoring it by name ALSO knocked out headers
; the arduino-esp32 core's own WebServer/ArduinoOTA need (SHA1Builder.h /
; SHA2Builder.h), failing the build somewhere that looks entirely unrelated.
lib_ignore =
	ESPAsyncTCP
	RPAsyncTCP
; Declared EXPLICITLY rather than left to the LDF: these libraries have .cpp
; files, so a bare -I makes their headers findable WITHOUT registering the
; library -- everything compiles and then dies at link with a wall of undefined
; references. (That differs from the sloplog/slopglow trap CLAUDE.md records:
; those are header-only, so -I alone genuinely is enough for them.)
lib_deps =
	${common_s3_libs.lib_deps}
	symlink://lib/espasyncwebserver
	symlink://lib/asynctcp
build_flags =
	${env:s3_main.build_flags}
	-DSLOPSYNC_WS_ASYNC=1
	; -isystem, not -I: these are VENDORED third-party headers reached from src/,
	; and src/ now compiles under -Wconversion/-Wshadow/-Wextra. -isystem marks
	; them as system headers so their warnings are suppressed while ours are not.
	; Without this, enforcing the warning set on our code would be gated on
	; cleaning up code we do not own and re-vendor from upstream.
	-isystem lib/espasyncwebserver/src
	-isystem lib/asynctcp/src
	; AsyncTCP's own task: the SlopSync hub tick is 5 ms and motion is Core-1, so
	; the network task belongs on Core 0 with the rest of comms.
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=0
	; `-DSLOPSYNC_HEAP_BISECT=1` was here and came out with the poisoner under the
	; same 2026-08-01 ruling -- it gated heap_caps_check_integrity_all() probes on
	; the WS connect/refuse/disconnect paths and around cleanupClients(), each of
	; which walks the WHOLE heap in milliseconds. On a 1 kHz motion loop that is a
	; latency spike tied to network events, which is exactly what the DIR ladder
	; must not have. Re-add it with the four CONFIG_HEAP_* flags, never alone.

[env:sd32-ota]
extends = env:sd32
; --- Network flashing over ArduinoOTA (espota) ---
upload_protocol = espota
; Device's usual address (works over Tailscale). Override on the CLI with
; `--upload-port <ip>` if it ever moves — never guess/port-scan (see .clinerules).
upload_port = 192.168.1.229
; extra_scripts is NOT inherited additively when redefined, so we re-list the
; web-UI builder AND add the auth-injection hook. ota_auth.py sources the secret
; from include/secrets.h so it stays out of git. :3
extra_scripts =
	pre:build_webui.py
	pre:tools/ota_auth.py

[env:sd32-headless]
; sd-4v9 Phase A: the S3 diet. No WiFi init, no HTTP server, no ArduinoOTA,
; no UDP discovery -- every duty rides the C5 bridge (OTA, diag, token mint)
; or SlopSync. Flash over the bridge: POST the firmware.bin to the C5's
; /api/ota/s3. Reversible by serial-flashing an sd32-ota image back.
extends = env:sd32
build_src_flags = ${env:s3_main.build_src_flags} -DSD32_HEADLESS

; =============================================================================
; ASYNC-WEBSOCKET ENVIRONMENTS
;
; ESP32Async (lib/espasyncwebserver, lib/asynctcp) is THE only WS transport;
; -DSLOPSYNC_WS_ASYNC=1 is required and the flag remains only because the
; source still reads it. History + the A/B that decided this:
; docs/http-plane-retirement.md.
;
; The libs are VENDORED rather than pulled from the registry because
; AsyncWebSocket carries a local RFC 6455 subprotocol patch — see
; lib/espasyncwebserver/VENDORED.md.
; =============================================================================
[env:sd32-async]
extends = env:sd32
; Belt and braces: the vendored library.json no longer declares dependencies,
; but if a future re-vendor restores them, PlatformIO will install the
; esp8266/rp2040 AsyncTCP variants despite their platform filters and then fail
; to compile them for xtensa. Ignoring them by name makes that impossible
; rather than merely unlikely.
; NOTE: 'Hash' is deliberately NOT ignored. It is an esp8266-only dependency of
; upstream ESPAsyncWebServer, but ignoring it by name ALSO knocked out headers
; the arduino-esp32 core's own WebServer/ArduinoOTA need (SHA1Builder.h /
; SHA2Builder.h), failing the build somewhere that looks entirely unrelated.
lib_ignore =
	ESPAsyncTCP
	RPAsyncTCP
; The vendored pair is declared EXPLICITLY rather than left to LDF.
;
; Why not just -I: these libraries have .cpp files. -I makes their headers
; findable without REGISTERING the library, so everything compiles and then dies
; at link with a wall of undefined references to AsyncWebSocket/AsyncWebServer.
; That differs from the sloplog/slopglow trap CLAUDE.md records -- those are
; header-only, so -I alone genuinely is enough for them.
;
; Why not lib_ldf_mode = deep+: it re-resolves EVERY dependency in the graph,
; which has broken unrelated libraries before. Declaring the two libraries we
; actually added keeps the blast radius to just those two.
lib_deps =
	${common_s3_libs.lib_deps}
	symlink://lib/espasyncwebserver
	symlink://lib/asynctcp
build_flags =
	${env:sd32.build_flags}
	-DSLOPSYNC_WS_ASYNC=1
	; -isystem, not -I: these are VENDORED third-party headers reached from src/,
	; and src/ now compiles under -Wconversion/-Wshadow/-Wextra. -isystem marks
	; them as system headers so their warnings are suppressed while ours are not.
	; Without this, enforcing the warning set on our code would be gated on
	; cleaning up code we do not own and re-vendor from upstream.
	-isystem lib/espasyncwebserver/src
	-isystem lib/asynctcp/src
	; AsyncTCP's own task: the SlopSync hub tick is 5 ms and motion is Core-1, so
	; the network task belongs on Core 0 with the rest of comms.
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=0
	; STACK_SIZE=8192 is inherited from env:s3_main now (it used to be this env's
	; one distinguishing flag) — not repeated here so there is one home for it.
	; Per-client TX queue depth. LEFT AT THE UPSTREAM esp32 DEFAULT (32) ON
	; PURPOSE -- this line exists to record why it is NOT 96.
	;
	; It was briefly raised to 96 because the catalog BLOB transfer blasted all 57
	; chunks synchronously and discarded transport refusals, so a 32-deep queue did
	; not throttle the transfer, it CORRUPTED it (measured: 47/57 chunks arriving).
	; Raising the queue "fixed" that by buying correctness with heap: 3x the
	; worst-case per-client buffering drove the device's heap low-water to 208 B
	; under 3 clients, which is not a margin, it is luck.
	;
	; The real fix went where the bug was -- Hub::pumpBlobTransfer now paces at 8
	; chunks/tick and RETRIES on refusal (SPEC §8.4). ~1.7 KB framed per tick is a
	; quarter of a 32-deep queue, so the transfer paces itself BELOW the queue
	; instead of trying to own it. Do not raise this to paper over a sender that
	; ignores backpressure; fix the sender.
	; -DWS_MAX_QUEUED_MESSAGES=32   (upstream default; stated, not overridden)

[env:sd32-async-ota]
extends = env:sd32-async
; NOTE: espota is broken on this host — deploy with the HTTP OTA path
; (POST /api/ota with X-OTA-Token) instead of `-t upload`. Kept for parity.
upload_protocol = espota
upload_port = 192.168.1.229
extra_scripts =
	pre:build_webui.py
	pre:tools/ota_auth.py


; =============================================================================
; C5 ENVIRONMENTS — pioarduino fork, isolated from S3 stable toolchain
;
; WHY pioarduino?
;   The official `platformio/platform-espressif32` registry package lags months
;   behind on new silicon support. The `pioarduino` fork is a community-maintained
;   drop-in replacement that tracks arduino-esp32 releases closely and ships
;   ESP32-C5 support in its stable release ZIPs. It is the de-facto standard for
;   cutting-edge ESP32 targets in PlatformIO as of 2025/2026.
;
;   Release 55.03.39 = Arduino ESP32 v3.3.9 / ESP-IDF v5.5.4 — the first stable
;   release with solid ESP32-C5 Arduino support. No platform_packages override
;   needed; the ZIP bundles the correct framework version. yippie! :3
; =============================================================================

; -----------------------------------------------------------------------------
; [env:c5_probe] - memory-budget probe for the comms-MCU split proposal.
; Compiles ONLY src/c5_probe/. Answers Gate A of docs/c5-comms-offload.md: how
; much internal SRAM survives WiFi 6 + LWIP + a minimal OTA-only HTTP surface on
; a C5-Zero (no PSRAM). Not production firmware -- flashing it REPLACES whatever
; node firmware is currently on the C5.
; -----------------------------------------------------------------------------
[env:c5_probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c5-zero
framework = arduino
; default.csv gave 1.25 MB app slots plus a 1.5 MB SPIFFS the bridge never
; touches -- it mounts no filesystem at all. min_spiffs keeps BOTH OTA slots
; (the C5's own /api/ota is now the S3's flash path, so it must not be lost)
; and spends the dead filesystem on app: 1.25 MB -> 1.875 MB.
; CHANGING THIS NEEDS A USB FLASH. OTA cannot rewrite a partition table.
board_build.partitions = min_spiffs.csv
lib_deps = ${common_c5_libs.lib_deps}
monitor_speed = ${common.monitor_speed}
; Regenerates src/c5_probe/logview_gz.h from tools/logview/logview.html, so the
; /logs page in flash can never be older than its source (T20 staleness gate).
; The script still runs standalone; see its docstring.
; Same gate for src/c5_probe/webui_gz.h from webui/dist/index.html: the S3 is
; headless, so this bridge serves the only UI the machine has. A missing
; webui/dist FAILS the build rather than baking a blank page.
extra_scripts =
	pre:tools/gen_logview_header.py
	pre:tools/gen_webui_header.py
; 460800, not ${common.upload_speed}: the C5-Zero's native USB-JTAG bridge drops
; bytes at 1.5 Mbaud; this is the fastest rate that flashes cleanly.
upload_speed = 460800
upload_port = COM13
monitor_port = COM13
board_build.f_cpu = 240000000L
build_src_filter = +<c5_probe/*>
build_flags =
	-O2
	-std=gnu++2b
	; SlopSync headers from the sibling checkout. The C5 bridge uses the
	; CANONICAL COBS codec (wire/serial_cobs.hpp) and ESTOP scanner
	; (core/estop_frame.hpp) rather than reimplementing SPEC §13.5 framing.
	-I../SlopSync/lib/slopsync/include
	; Serial must land on the native USB-Serial/JTAG CDC, not UART0 — the
	; C5-Zero has no USB-UART bridge chip, so without this the probe prints
	; into a pin nobody is reading and COM13 stays silent.
	; USB_MODE=1 selects the hardware USB-Serial/JTAG (HWCDC) path; without it
	; CDC_ON_BOOT resolves to USBSerial, which is the S3's USB-OTG peripheral
	; and does not exist on the C5 ("'USBSerial' was not declared").
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	; SlopGlow core (hardware-free, header-only): the C5 speaks the same
	; two-axis LED grammar as the S3. See logging-leds.md.
	-Ilib/slopglow/include

; -----------------------------------------------------------------------------
; [env:rp2350_motion] - the motion coprocessor (sd-dxy), Waveshare RP2350-Zero.
; SPI slave to the S3 over the S3DISP JST; renders C1 motion segments to
; step/dir. Vocabulary: include/comms/MotionLinkProtocol.h (one header, both
; ends -- T20). Flashes over its own USB (UF2/picotool), never OTA.
; -----------------------------------------------------------------------------
[env:rp2350_motion]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_zero
framework = arduino
build_src_filter = +<rp2350_motion/*>
lib_deps =
	adafruit/Adafruit NeoPixel@^1.11.0
build_unflags = -std=gnu++17
build_flags =
	-O2
	-std=gnu++2b
	-Iinclude
	; SlopGlow core: the coprocessor speaks the fleet LED grammar too
	; (rainbow until the S3's first SPI word arrives).
	-Ilib/slopglow/include
	; The engine RUNS HERE now (sd-4k1.4): slopmotion and its vendored ruckig
	; are header-declared libraries under lib/ that the LDF chain-discovers from
	; the include in main.cpp -- explicit -I mirrors env:s3_main's own belt-and-
	; suspenders for the identical pair. gnu++2b matches every other env that
	; compiles slopmotion (native, s3_main, sd32*).
	-Ilib/slopmotion/include
	-Ilib/ruckig/include
; Post-build: emits firmware-tbyb.{bin,uf2} with the PICOBIN try-before-you-buy
; bit set -- the variant the S3 ships over the link. The plain image stays the
; USB rescue image: the bootrom skips a TBYB image on a normal boot by design.
; See build-test-deploy.md, "RP2350 update over the link".
extra_scripts = post:tools/rp2350_tbyb.py

[env:rp2350_probe]
; Scope-less wire probe (sd-dxy bring-up): NO SPI init; counts CS falls by
; interrupt, reports SCK/MOSI pad activity over USB serial once a second.
; Pixel: green = CS arriving, red = silent bus.
extends = env:rp2350_motion
build_flags =
	${env:rp2350_motion.build_flags}
	-DMLINK_WIRE_PROBE

; -----------------------------------------------------------------------------
; [env:rp2350_bench] - commit() timing gate (sd-4k1.1). Cross-compile only, no
; RP2350 on this bench: proves the build, not the number. See
; src/rp2350_bench/main.cpp for the full constraint set (worst-case regression
; picked from test/native/test_slopmotion, the DCP-double caveat, the core-1
; stack ceiling). Flash + read recipe is on the bd issue, not restated here.
; -----------------------------------------------------------------------------
[env:rp2350_bench]
extends = env:rp2350_motion
build_src_filter = +<rp2350_bench/*>
build_unflags = -std=gnu++17 -std=gnu++20
build_flags = ${env:rp2350_motion.build_flags}

; =============================================================================
; NATIVE ENVIRONMENT — desktop unit tests (doctest), no hardware, no Arduino
;
; Runs the hardware-free math/logic cores (MotionProfile, Kinematics, later
; slopsync-core) on the host compiler. This is the refactor safety net and the
; future home of the motion simulator + SlopSync conformance suite.
;   Run: pio test -e native
; Requires a host GCC in PATH (WinLibs MinGW-w64 on this machine). Tests live
; under test/native/test_*/ — the test_filter keeps future embedded on-target
; tests (test/embedded/*) out of native runs. :3
; =============================================================================
[env:native]
platform = native
test_framework = doctest
test_filter = native/*
; Header-only cores under test are included directly by the test sources —
; no src/ compilation (test_build_src defaults off), no Arduino. LDF stays at
; default chain mode: it must resolve the doctest package include path (LDF=off
; hides the installed doctest headers and the build can't find doctest.h). :3
build_flags =
	-std=gnu++2b
	-O2
	-Wall
	-Iinclude/system
	-Iinclude/motion
	-Iinclude/comms
	-Iinclude/ui
	; SlopSync repo split (slopsync.pin pins the sha): only test_slopsync_devicecatalog
	; and test_slopsync_discovery still touch lib/slopsync headers, from the sibling
	; checkout -- explicit because this env declares no lib_deps for LDF to resolve it.
	-I../SlopSync/lib/slopsync/include

; ---- quad_probe -------------------------------------------------------------
; Bench probe: does the AIM drive follow A/B quadrature on the EXISTING PUL/DIR
; pins? Standalone by construction -- no FAS, no arbiter, no WiFi, no web UI, so
; nothing here can be confused for the production motion path. It DOES write
; drive registers (arming, gains, baud, 0x7B setpoints) -- bench use only, with
; the operator watching the machine.
; Flash over USB, run the serial monitor, then reflash sd32-ota to restore.
[env:quad_probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = arduino-nano-esp32
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
upload_port = COM11
monitor_port = COM11
board_build.f_cpu = 240000000L
build_src_filter = +<quad_probe/*>
build_flags =
	-O2
	-std=gnu++2b
	-DARDUINO_USB_CDC_ON_BOOT=1
