# =========================================================================
# SlopSync documentation site.
#
# BUILD IT FROM THIS DIRECTORY:
#     cd docs-site
#     python tools/gen_docs_tables.py      # refresh generated tables first
#     mkdocs build --strict
#
# The `cd` is not cosmetic. pymdownx.snippets resolves `base_path` against the
# working directory, and `check_paths: true` below turns a wrong directory into
# a loud failure instead of a site that silently loses every glossary tooltip.
#
# NOTHING in this file points outside docs-site/. The single outside path — the
# protocol registry — lives in site.config.yml and is read only by the
# generator. See README.md, "Extracting this directory".
# =========================================================================

site_name: SlopSync
site_description: >-
  SlopSync is an open device-shadow and capability-negotiation protocol for
  motion machines. One app, many firmwares, one truth about what the machine
  is doing.
site_author: The SlopSync contributors

# The canonical origin. It feeds sitemap.xml and every canonical link, so
# CHANGING IT LATER ROTS LINKS. `.invalid` is the reserved placeholder TLD
# (RFC 2606): if you see it in a deployed sitemap, the deploy forgot to set
# SLOPSYNC_SITE_URL. CI computes the correct GitHub Pages origin; a custom
# domain overrides it. README.md explains why a custom domain is worth it.
site_url: !ENV [SLOPSYNC_SITE_URL, "https://slopsync.invalid/"]

copyright: >-
  SlopSync is provided to the community as a tool. It favours no firmware,
  no vendor and no product.

docs_dir: docs
site_dir: site

# --------------------------------------------------------------------------
# Strictness. With `mkdocs build --strict` every one of these becomes a build
# failure. A dead cross-reference in a protocol specification is a defect, not
# a cosmetic issue — implementers follow those links.
# --------------------------------------------------------------------------
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  custom_dir: overrides
  language: en

  # No web fonts. The build stays hermetic and offline, the site loads no
  # third-party resource, and the datasheet look comes from system stacks
  # chosen in assets/stylesheets/datasheet.css.
  font: false

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/circle-half-full
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/circle-half-full
        name: Switch to light

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips        # renders <abbr> as the Dictionary tooltip

  icon:
    logo: material/sine-wave
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/datasheet.css

# --------------------------------------------------------------------------
# Mermaid, VENDORED. Material otherwise fetches mermaid.min.js from unpkg.com
# at page load, which would make a diagram page — and only a diagram page —
# depend on a CDN while the rest of this build is hermetic.
#
# A protocol whose identity is LAN-first and offline-first must not phone a
# CDN to draw its own diagrams, and the failure modes are ordinary: a blocked
# network, an air-gapped bench, a CDN outage, a corporate proxy. Any of them
# turns every figure on this site into raw text.
#
# Material skips its own fetch whenever the global `mermaid` is already
# defined, which this script does. Provenance, license, hash and the update
# procedure are in VENDORED.md. The file is byte-identical to upstream: never
# patch it locally.
# --------------------------------------------------------------------------
extra_javascript:
  - assets/javascripts/mermaid.min.js

extra:
  # `mike` publishes each tagged spec version as its own tree and adds the
  # version selector. Readers of a protocol specification must be able to pin.
  version:
    provider: mike
    default: latest
    alias: true
  generator: false

plugins:
  - search

# Guides get glossary tooltips. The Specification does not: in a normative
# document every word on the page is normative or visibly marked otherwise,
# and a hover definition over "hub" inside a MUST clause is a second, invisible
# source of meaning. The hook strips the <abbr> wrappers under `spec/` only.
hooks:
  - hooks/spec_no_glossary.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys
  # Diagrams. A ```mermaid fence is handed to Material's own Mermaid
  # integration, which renders it to SVG in the browser and colors it from
  # the `--md-mermaid-*` custom properties. assets/stylesheets/datasheet.css
  # sets those per palette, so one diagram source renders correctly in both
  # schemes and follows the palette toggle live.
  #
  # WHY TEXT DIAGRAMS: the source lives in git, diffs like prose, and cannot
  # rot into a stale binary nobody can edit. Byte-field strips are the one
  # thing Mermaid cannot express; those are HTML/CSS (`.ss-bytemap`).
  #
  # mermaid.min.js is VENDORED (see `extra_javascript` above and VENDORED.md),
  # so no page on this site fetches anything from the network.
  #
  # ONE TRAP, VERIFIED THE HARD WAY: mermaid's flowchart grammar cannot lex a
  # parenthesis inside a `classDef` value, so `fill:var(--x)` is a PARSE
  # ERROR — and a fence that fails to parse renders as raw text while
  # `--strict` reports nothing. Diagram sources therefore carry the hex
  # dual-ground palette documented in datasheet.css. If you add a diagram,
  # prove it renders; the build cannot prove it for you.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde
  # The glossary. `includes/abbreviations.md` is GENERATED from
  # dictionary.yaml and appended to every page, so a defined term shows its
  # one definition wherever it appears on the site.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      auto_append:
        - includes/abbreviations.md

nav:
  - Home: index.md

  - Understand:
      - understand/index.md
      - How it works: understand/how-it-works.md
      - Anatomy of a frame: understand/anatomy.md
      - Capabilities and custom hardware: understand/capabilities.md
      - What it replaces: understand/what-it-replaces.md
      - Ecosystem and compatibility: understand/ecosystem.md
      - Security model and the audit: understand/security.md
      - For everyone: understand/for-everyone.md

  - Build with it:
      - build/index.md
      - Quickstart: build/quickstart.md
      - Client guides:
          - JavaScript: build/clients/javascript.md
          - C#: build/clients/csharp.md
          - C++: build/clients/cpp.md
          - Python: build/clients/python.md
      - Plugin guide: build/plugins.md
      - Hub implementer guide: build/hub.md
      - CLI guide: build/cli.md
      - Local testing: build/local-testing.md

  # GENERATED TIER. Every page below except Errata is produced from
  # docs/slopsync/SPEC.md by tools/gen_spec_pages.py. Keep this block in sync
  # with the generator: `python tools/gen_spec_pages.py --nav` prints it.
  - Specification:
      - spec/index.md
      - Foundations: spec/foundations.md
      - Wire format: spec/wire-format.md
      - Session layer: spec/session.md
      - Time and sequencing: spec/time.md
      - Catalog: spec/catalog.md
      - Channel classes: spec/channels.md
      - QoS and congestion: spec/qos.md
      - Safety: spec/safety.md
      - Security and trust: spec/security.md
      - Transports and relays: spec/transports.md
      - Legacy interop: spec/legacy.md
      - Errors and diagnostics: spec/errors.md
      - Conformance: spec/conformance.md
      - Known limitations: spec/limitations.md
      - Rendering: spec/rendering.md
      - Worked session traces: spec/traces.md
      - Catalog schema (CDDL): spec/schema.md
      - Appendices A-G: spec/appendices.md
      - Rationale and history: spec/rationale.md
      - Errata: spec/errata.md

  - Reference:
      - reference/index.md
      - Dictionary: reference/dictionary.md
      - Registry:
          - reference/registry/index.md
          - Frame types: reference/registry/frames.md
          - Channels: reference/registry/channels.md
          - CBOR keys: reference/registry/cbor-keys.md
          - Catalog vocabulary: reference/registry/catalog-vocabulary.md
          - Event kinds: reference/registry/events.md
          - Safety codes: reference/registry/safety.md
          - Pairing modes: reference/registry/pairing.md
          - NACK codes: reference/registry/errors.md
          - Limits and defaults: reference/registry/limits.md
          - Discovery: reference/registry/discovery.md
          - Rendering vocabulary: reference/registry/rendering.md
      - Channel catalog: reference/channel-catalog.md
      - Channel grid: reference/channel-grid.md

  - Community:
      - community/index.md
      - Governance: community/governance.md
      - Contributing: community/contributing.md
      - RFC process: community/rfc-process.md
